<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data: blob:; media-src 'self' blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>neoascii</title>
<meta name="version" content="1.0.1">
<meta name="application-name" content="neoascii">
<style>
/* ---------- tokens ---------- */
:root{
  --w:#ffffff;
  --b:#000000;
  --mid:#808080;      /* 50% grey, the third state of every control */
  --unit:64px;          /* height of every row */
  --gap:34px;
  --side:14px;
  --col:min(560px, calc(100vw - 40px));
  /* THE DISPLAY AND THE DRAWER ARE THE SAME WIDTH.
     --screen is that width. It is the column, unless the two
     arrows would not fit beside it, in which case it is whatever
     is left after them. So on a desktop the arrows sit outside the
     column and the display fills it; on a phone they stay inside
     and the display, and the drawer with it, gives up the room. */
  --arrowW:48px;      /* the triangle needs 15px. The rest is the tap target. */
  --arm:calc(var(--arrowW) + var(--side));
  --screen:min(var(--col), calc(100vw - 12px - 2 * var(--arm)));
  --rowW:calc(var(--screen) + 2 * var(--arm));
  /* THE DRAWER TAKES WHAT IS LEFT, AND NO MORE.
     It used to take a fixed share of the height, which on a phone
     came to more than the room between the display and the EXPORT
     button. The button was pushed off the foot of the screen and
     the last control was cut in half. This is the height of the
     screen less the three rows, the gaps between them and a margin,
     so the button always sits clear below with space around it. */
  --drawer-max:max(180px, calc(var(--vh) - (var(--vh) * 0.09)
    - 3 * var(--unit) - 2 * var(--gap) - 40px));
  /* The display follows the dot matrix in the analog tuner: dim
     dots everywhere in the grid, lit dots with a real glow around
     them. It turns over with the rest of the controls: white on
     dark glass, and black on white glass once they go black. */
  --lcd-panel:#0d0d0d;
  --lcd-panel-lt:#f2f2f2;
  --ease:cubic-bezier(.22,.61,.36,1);
  /* 100vh does not shrink when a phone browser shows its bars, so
     dvh is used where it exists. */
  --vh:100vh;
  --reveal:.65s;
}

@supports (height:100dvh){ :root{--vh:100dvh;} }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

html,body{
  margin:0; padding:0; height:100%; width:100%;
  background:#000; overflow:hidden;
  font-family:ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  touch-action:manipulation;
  overscroll-behavior:none;
}

canvas{display:block;}

/* ---------- stage ---------- */
#stage{
  position:fixed; inset:0; width:100%; height:100%;
  background:#000; z-index:0;
}

/* The video is never shown. It is only a source of frames, so it
   is kept at one pixel: a display:none video does not decode in
   every browser. */
#video{
  position:fixed; left:0; top:0; width:1px; height:1px;
  opacity:0; pointer-events:none; z-index:-1;
}

/* ---------- control column ---------- */
#ui{
  position:fixed; inset:0; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:0 6px env(safe-area-inset-bottom);
  padding-top:calc(50vh - var(--unit) / 2);
  overflow-y:auto; overscroll-behavior:contain;
  transition:opacity .28s var(--ease), padding-top 1.95s var(--ease);
}
#ui.up{padding-top:max(9vh, calc(18px + env(safe-area-inset-top)));}
#ui.gone{opacity:0; pointer-events:none;}

.row{width:var(--col); display:flex; align-items:center; justify-content:center;}
.stack{width:var(--rowW); display:flex; flex-direction:column; align-items:center;}

#styleWrap{width:var(--rowW);}
#actOuter{width:var(--col);}
#styleWrap,#actOuter{
  overflow:hidden; max-height:0;
  display:flex; flex-direction:column; justify-content:flex-end;
  transition:max-height var(--reveal) var(--ease);
}
#styleWrap > .row,#actOuter > .row{padding-top:var(--gap);}
#ui.s2 #styleWrap{max-height:calc(var(--unit) + var(--gap));}
#ui.s3 #actOuter{max-height:calc(var(--unit) + var(--gap));}

/* THE CONTROLS TAKE ONE OF THREE COLOURS.
   They used to read the brightness of the scene behind each of them
   and swap, which meant a button changed colour as the music moved
   under it. They now follow the two colours you chose:

     dark background   -> white, or 50% grey if the ink is white too
     light background  -> black, or 50% grey if the ink is black too

   Grey is only ever reached when white on white or black on black
   would have disappeared. */
.solid{background:var(--w); color:var(--b); border:0;}
.solid.lt{background:var(--b); color:var(--w);}
.solid.gr{background:var(--mid); color:var(--b);}
.line{color:var(--w); background:transparent;}
.line.lt{color:var(--b);}
.line.gr{color:var(--mid);}
.solid,.line{transition:background-color .13s linear, color .13s linear, opacity .2s linear;}

/* ---------- 1. source row ---------- */
#srcRow{gap:0;}
#srcLeft{
  flex:0 1 auto; display:flex; justify-content:flex-end; overflow:hidden;
  max-width:0; transition:max-width var(--reveal) var(--ease);
}
#ui.s1 #srcLeft{max-width:calc(var(--col) - var(--unit));}
#srcInner{
  display:flex; align-items:center; gap:var(--side);
  margin-right:var(--side);
  width:calc(var(--col) - var(--unit) - var(--side));
}

.circ{
  flex:0 0 auto; width:var(--unit); height:var(--unit); border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  padding:0; position:relative; border:0;
}
#addBtn{position:relative; z-index:2;}
#playBtn svg{width:44%; height:44%; fill:currentColor;}

.plus::before,.plus::after{
  content:""; position:absolute; background:currentColor; border-radius:2px;
}
.plus::before{width:34%; height:5px;}
.plus::after{height:34%; width:5px;}

#waveWrap{
  flex:1 1 auto; min-width:0; height:var(--unit); position:relative;
  cursor:pointer; border:1px solid currentColor; border-radius:6px; overflow:hidden;
  touch-action:none;
}
#waveCv{width:100%; height:100%;}

/* ---------- 2. style roladex ---------- */
#styleRow{width:var(--rowW); gap:var(--side); position:relative; z-index:2;}

.arrow{
  flex:0 0 auto; width:var(--arrowW); height:var(--unit); border:0; padding:0; cursor:pointer;
  background:transparent; display:flex; align-items:center; justify-content:center;
}
.arrow i{
  display:block; width:0; height:0;
  border-top:11px solid transparent; border-bottom:11px solid transparent;
}
#prevBtn i{border-right:15px solid currentColor;}
#nextBtn i{border-left:15px solid currentColor;}
.arrow[disabled]{opacity:.22; cursor:default;}
.arrow:not([disabled]):active i{transform:scale(.82);}

#lcd{
  flex:0 0 var(--screen); min-width:0;
  height:var(--unit); border:2px solid currentColor; border-radius:9px;
  padding:5px; cursor:pointer; position:relative; overflow:hidden;
  background:var(--lcd-panel);
  box-shadow:
    inset 0 0 0 1px #000,
    inset 0 4px 14px rgba(0,0,0,.8),
    0 0 26px rgba(255,255,255,.10);
}
#lcd.lt{
  background:var(--lcd-panel-lt);
  box-shadow:
    inset 0 0 0 1px rgba(0,0,0,.35),
    inset 0 4px 14px rgba(0,0,0,.22),
    0 0 26px rgba(0,0,0,.14);
}
#lcd.lt::after{background:linear-gradient(180deg, rgba(255,255,255,.5), transparent);}
#lcdCv{width:100%; height:100%;}
/* the sheen on the glass, across the top half only */
#lcd::after{
  content:""; position:absolute; left:0; right:0; top:0; height:46%;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.06), transparent);
}

/* ---------- the drawer ----------
   Still the same metal, but it is now a tabbed panel. It takes the
   whole column and scrolls inside itself, because eight tabs of
   controls do not fit under a display. */
#drawer{
  position:relative; z-index:1;
  width:var(--screen);
  margin-top:-2px;
  max-height:0; overflow:hidden;
  transition:max-height .36s var(--ease);
}
#drawer.open{max-height:min(620px, var(--drawer-max));}

#drawerIn{
  display:flex; flex-direction:column;
  max-height:min(620px, var(--drawer-max));
  border:2px solid currentColor; border-top-width:0;
  border-radius:0 0 11px 11px;
  background:
    repeating-linear-gradient(90deg,
      rgba(255,255,255,.05) 0 1px, rgba(255,255,255,0) 1px 3px),
    linear-gradient(180deg,
      #5c6168 0%, #44484e 7%, #4e535b 28%, #3c4046 68%, #2c2f34 100%);
  box-shadow:
    inset 0 9px 13px -9px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 12px 26px rgba(0,0,0,.5);
  transform:translateY(-10px);
  transition:transform .36s var(--ease);
  overflow:hidden;
}
#drawer.open #drawerIn{transform:translateY(0);}

/* THE TAB STRIP NEVER SCROLLS SIDEWAYS.
   It is a grid of --n equal columns, which App sets to the number
   of tabs. When the drawer is too narrow to hold them all in one
   line the rules further down switch it to a fixed pair of rows,
   three and two or three and three, both filling the width. A row
   you have to drag hides tabs behind an edge, and a tab you cannot
   see is a tab you will not use. */
#tabs{
  flex:0 0 auto; display:grid; gap:2px; padding:8px 10px 0;
  grid-template-columns:repeat(var(--n,5),1fr);
  border-bottom:1px solid rgba(0,0,0,.5);
  box-shadow:0 1px 0 rgba(255,255,255,.10);
}
.tab{
  min-width:0; border:0; cursor:pointer; font-family:inherit;
  font-size:9.5px; letter-spacing:.13em; font-weight:700;
  padding:9px 4px 8px; border-radius:6px 6px 0 0;
  color:#c2c8d0; background:rgba(0,0,0,.14);
  text-shadow:0 1px 1px rgba(0,0,0,.55);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
/* The chosen tab is a lit recess, not a raised plate. Light text
   needs something dark behind it. */
.tab.on{
  color:#f4f8fc; background:linear-gradient(180deg,#282c32,#3a3f47);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.12);
}

#panel{
  flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px 16px 18px;
  display:grid; grid-template-columns:1fr 1fr; gap:13px 18px;
  align-content:start;
}

.knob{display:flex; flex-direction:column; gap:6px; min-width:0;}
/* All of the wording in the drawer is a light grey, near white,
   over a dark shadow. Dark letters with a white shadow read well
   on the pale top of the metal and badly on the dark foot of it. */
.knob label{
  font-size:9.5px; letter-spacing:.17em; font-weight:700; text-transform:uppercase;
  display:flex; justify-content:space-between; gap:6px; white-space:nowrap;
  color:#e6eaf0; text-shadow:0 1px 1px rgba(0,0,0,.6);
  overflow:hidden;
}
.knob label span{overflow:hidden; text-overflow:ellipsis;}
.knob label b{font-weight:600; color:#d3dae2; letter-spacing:.06em; flex:0 0 auto;}

.sub,.note,.presets,.knob.sw,.stamp{grid-column:1 / -1;}
.stamp{
  margin:14px 0 0; padding-top:10px; text-align:center;
  border-top:1px solid rgba(0,0,0,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  font-size:9px; letter-spacing:.26em; font-weight:700; color:#c6cdd6;
  text-shadow:0 1px 1px rgba(0,0,0,.55);
}
/* The highlight belongs directly UNDER the dark rule, so the two
   read as one groove. It used to sit at the bottom of the element,
   which drew a second line below the words and made a box the text
   was not in the middle of. The height is fixed and the text is
   centred in it, so there is nothing left to drift. */
.sub{
  display:flex; align-items:center;
  height:30px; line-height:1;
  font-size:9px; letter-spacing:.24em; font-weight:800; color:#f0f4f8;
  text-shadow:0 1px 1px rgba(0,0,0,.6);
  margin:9px 0 1px;
  border-top:1px solid rgba(0,0,0,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}
.note{
  margin:0; font-size:10px; line-height:1.5; color:#cdd4dc;
  text-shadow:0 1px 1px rgba(0,0,0,.5);
}
.note.info{color:#eaeff5; font-weight:600;}

/* sliders */
.knob input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:20px;
  background:transparent; cursor:pointer; margin:0;
}
.knob input[type=range]::-webkit-slider-runnable-track{
  height:6px; border-radius:3px;
  background:linear-gradient(180deg,#13161a,#333840);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.15);
}
.knob input[type=range]::-moz-range-track{
  height:6px; border-radius:3px;
  background:linear-gradient(180deg,#13161a,#333840);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.15);
}
.knob input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:17px; height:17px; border-radius:50%; margin-top:-5.5px;
  background:linear-gradient(180deg,#f4f6f9 0%,#ccd1d8 46%,#8d939b 100%);
  border:1px solid #202327;
  box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
}
.knob input[type=range]::-moz-range-thumb{
  width:17px; height:17px; border-radius:50%;
  background:linear-gradient(180deg,#f4f6f9 0%,#ccd1d8 46%,#8d939b 100%);
  border:1px solid #202327;
  box-shadow:0 2px 3px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.9);
}

/* dropdowns, text and colour fields */
.knob select,.knob input[type=text]{
  width:100%; min-width:0; font-family:inherit; font-size:11px; font-weight:600;
  letter-spacing:.04em; color:#e9edf2; padding:7px 8px; height:32px;
  border:1px solid #191c21; border-radius:5px;
  background:linear-gradient(180deg,#2b2f35,#1a1d22);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.14);
  -webkit-appearance:none; appearance:none;
}
.knob select{padding-right:22px;
  background-image:
    linear-gradient(45deg,transparent 50%,#aab0b8 50%),
    linear-gradient(135deg,#aab0b8 50%,transparent 50%),
    linear-gradient(180deg,#2b2f35,#1a1d22);
  background-position:calc(100% - 12px) 14px, calc(100% - 7px) 14px, 0 0;
  background-size:5px 5px, 5px 5px, 100% 100%;
  background-repeat:no-repeat;
}
.knob input[type=color]{
  width:100%; height:32px; padding:2px; cursor:pointer;
  border:1px solid #191c21; border-radius:5px;
  background:linear-gradient(180deg,#2b2f35,#1a1d22);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.14);
}

/* the [X] switch */
.swbtn{
  display:flex; align-items:center; gap:9px; width:100%;
  border:0; background:transparent; cursor:pointer; padding:3px 0;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:#e6eaf0; text-shadow:0 1px 1px rgba(0,0,0,.6);
}
.swbtn .box{font-size:13px; font-weight:700; letter-spacing:-.04em;}
.swbtn .swlab{
  font-family:inherit; font-size:9.5px; letter-spacing:.17em; font-weight:700;
  text-align:left;
}

/* segmented buttons */
.seg{display:flex; gap:3px;}
.segb{
  flex:1 1 0; min-width:0; border:1px solid #191c21; cursor:pointer;
  font-family:inherit; font-size:9.5px; letter-spacing:.10em; font-weight:700;
  padding:8px 2px; border-radius:5px; color:#9aa2ab;
  background:linear-gradient(180deg,#2b2f35,#1a1d22);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.7);
}
.segb.on{
  color:#f4f8fc; background:linear-gradient(180deg,#585e67,#3d424a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 1px 2px rgba(0,0,0,.5);
}

/* looks and buttons */
.presets{display:flex; flex-wrap:wrap; gap:5px;}
.chip{
  border:1px solid #191c21; cursor:pointer; font-family:inherit;
  font-size:9px; letter-spacing:.11em; font-weight:700; color:#e6eaf0;
  padding:7px 9px; border-radius:14px;
  background:linear-gradient(180deg,#33383f,#1d2126);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.5);
}
.chip:active{transform:scale(.96);}

/* ---------- 3. the export button ---------- */
#actWrap{position:relative; width:var(--col); height:var(--unit);}
#actBtn{
  width:100%; height:100%; border-radius:calc(var(--unit) / 2);
  padding:0; cursor:pointer;
  font-size:13px; letter-spacing:.34em; font-weight:700; text-indent:.34em;
  font-family:inherit;
}
#actBtn[disabled]{opacity:.3; cursor:default;}
#actBtn:not([disabled]):active{transform:scale(.975);}

/* THE PROGRESS BAR IS NOT PART OF THE PANEL.
   It sits on its own, fixed to the foot of the screen, because the
   controls are hidden for the whole of an export and a progress bar
   you cannot see is no use to anybody. The pill IS the stop button,
   which is why it says so on its second line. */
#bar{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(26px + env(safe-area-inset-bottom));
  width:var(--col); height:var(--unit); z-index:7;
  display:none; overflow:hidden; padding:0; cursor:pointer;
  border-radius:calc(var(--unit) / 2);
  border:2px solid var(--w); background:#000;
  font-family:inherit;
}
#bar.on{display:block;}
#actWrap.busy #actBtn{visibility:hidden;}
#barFill{
  position:absolute; left:0; top:0; bottom:0; width:0%;
  background:var(--w); transition:width .2s linear;
}
#barTxt,#barSub{
  position:absolute; left:0; right:0; text-align:center;
  color:var(--w); mix-blend-mode:difference; pointer-events:none;
  white-space:nowrap; overflow:hidden; padding:0 14px;
}
#barTxt{
  top:calc(50% - 15px); font-size:10px; letter-spacing:.18em; font-weight:700;
}
#barSub{
  top:calc(50% + 2px); font-size:8px; letter-spacing:.26em; font-weight:700;
  opacity:.75;
}
#bar:active{transform:translateX(-50%) scale(.985);}

/* ---------- the eye ---------- */
#eyeBtn{
  position:fixed; right:12px; z-index:6;
  top:calc(10px + env(safe-area-inset-top));
  width:38px; height:38px; border-radius:50%; cursor:pointer; padding:0;
  border:1px solid rgba(255,255,255,.30);
  background:rgba(24,24,24,.5);
  color:#9aa0a6;
  display:flex; align-items:center; justify-content:center;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
#eyeBtn.lt{border-color:rgba(0,0,0,.35); background:rgba(230,230,230,.5); color:#4c5155;}
#eyeBtn.gr{border-color:rgba(0,0,0,.30); background:rgba(128,128,128,.45); color:#14181b;}
/* nothing to hide or show while a render is running */
#eyeBtn.busy{display:none;}
#eyeBtn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.7;}
/* The button shows what the press will DO, not what the state is.
   While the controls are on screen it is a struck through eye,
   because pressing it hides them. */
#eyeBtn .slash{opacity:1;}
#eyeBtn .pupil{opacity:.28;}
#eyeBtn.shut .slash{opacity:0;}
#eyeBtn.shut .pupil{opacity:1;}

/* ---------- the input sheet ----------
   The plus no longer goes straight to the file picker: a camera is
   an input as much as a file is, and there is no way to guess
   which one you meant. */
#sheet{
  position:fixed; inset:0; z-index:8; display:none;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.66);
  -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
  padding:20px;
}
#sheet.on{display:flex;}
#sheetIn{
  width:var(--col); max-width:100%;
  display:flex; flex-direction:column; gap:12px;
}
.opt,.optx{
  height:var(--unit); border-radius:calc(var(--unit) / 2); cursor:pointer;
  font-family:inherit; font-size:12px; letter-spacing:.28em; text-indent:.28em;
  font-weight:700; padding:0;
}
.opt{border:0; background:var(--w); color:var(--b);}
.opt[disabled]{opacity:.28; cursor:default;}
.optx{
  border:1px solid rgba(255,255,255,.45); background:transparent; color:var(--w);
  font-size:10px; letter-spacing:.22em; height:calc(var(--unit) - 14px);
}
.opt:not([disabled]):active,.optx:active{transform:scale(.975);}
/* ---------- status line ---------- */
#status{
  position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom));
  text-align:center; font-size:10px; letter-spacing:.22em; font-weight:600;
  color:var(--w); opacity:0; pointer-events:none; z-index:3;
  padding:0 20px;
  transition:opacity .3s linear;
}
#status.on{opacity:.55;}
#status.warn{opacity:.95;}
#status.gone{opacity:0;}

:focus-visible{outline:2px solid currentColor; outline-offset:3px;}
button:focus:not(:focus-visible){outline:none;}

#picker{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}

/* TWO FIXED ROWS WHEN ONE WILL NOT FIT.
   Five tabs need about 380 px of drawer and six about 455. Below
   that the strip becomes six columns: each tab takes two of them,
   which gives three to a row, and with five tabs the last two take
   three columns each so the second row still fills the width.
   Neither row scrolls, and every tab stays in view. */
@media (max-width:540px){
  #tabs.n5{grid-template-columns:repeat(6,1fr);}
  #tabs.n5 .tab{grid-column:span 2;}
  #tabs.n5 .tab:nth-child(4),#tabs.n5 .tab:nth-child(5){grid-column:span 3;}
}
@media (max-width:660px){
  #tabs.n6{grid-template-columns:repeat(6,1fr);}
  #tabs.n6 .tab{grid-column:span 2;}
}

/* ---------- narrow screens ----------
   The drawer keeps the width of the column at every screen size, so
   its edges line up with the display and the arrows above it. An
   earlier build let it run to the full width of the screen on a
   phone, which left it hanging off the right side and looking like
   it belonged to nothing. */
@media (max-width:430px){
  :root{--unit:56px; --gap:26px; --side:8px; --arrowW:44px;}
  /* One control to a row on a phone. The display and the drawer
     now share a width, so the drawer gives up the space the two
     arrows need, and two controls side by side in what is left
     would leave every label cut short. */
  #panel{padding:12px 14px 18px; gap:11px 12px; grid-template-columns:1fr;}
  .knob label{font-size:8px; letter-spacing:.08em;}
  #drawer.open,#drawerIn{max-height:var(--drawer-max);}
  #actBtn{font-size:12px;}
  #barTxt{font-size:9px; padding-left:15px; padding-right:56px;}
}

@media (prefers-reduced-motion:reduce){
  #srcLeft,#styleWrap,#actOuter,#drawerIn{transition:none;}
  #ui{transition:opacity .01s linear;}
  #drawer{transition:max-height .01s linear;}
  #barFill{transition:none;}
}
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>
<video id="video" playsinline preload="auto"></video>

<button id="eyeBtn" type="button" aria-pressed="false" aria-label="Hide the controls">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M1.6 12S5.4 5.5 12 5.5 22.4 12 22.4 12 18.6 18.5 12 18.5 1.6 12 1.6 12Z"/>
    <circle class="pupil" cx="12" cy="12" r="3.1"/>
    <path class="slash" d="M4 20 20 4"/>
  </svg>
</button>

<div id="ui">

  <div class="row" id="srcRow">
    <div id="srcLeft"><div id="srcInner">
      <button id="playBtn" class="solid circ" type="button" aria-label="Play" aria-pressed="false">
        <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <div id="waveWrap" class="line" role="slider" tabindex="0"
           aria-label="Playback position. Drag to move through the file."
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <canvas id="waveCv"></canvas>
      </div>
    </div></div>
    <button id="addBtn" class="solid circ plus" type="button" aria-label="Add an audio or video file"></button>
  </div>

  <div class="stack">
  <div id="styleWrap">
  <div class="row" id="styleRow">
    <button id="prevBtn" class="arrow line" type="button" disabled aria-label="Previous style"><i></i></button>
    <div id="lcd" class="line" role="button" tabindex="0" aria-label="Style. Open the controls." aria-expanded="false">
      <canvas id="lcdCv"></canvas>
    </div>
    <button id="nextBtn" class="arrow line" type="button" disabled aria-label="Next style"><i></i></button>
  </div>
  </div>

  <div id="drawer" class="line" aria-label="Controls">
    <div id="drawerIn">
      <div id="tabs" role="tablist" aria-label="Control groups"></div>
      <div id="panel"></div>
    </div>
  </div>
  </div>

  <div id="actOuter"><div class="row">
    <div id="actWrap">
      <button id="actBtn" class="solid" type="button" disabled>EXPORT</button>

    </div>
  </div></div>

</div>

<button id="bar" type="button" aria-label="Stop the export">
  <span id="barFill"></span>
  <span id="barTxt"></span>
  <span id="barSub">PRESS TO STOP</span>
</button>

<div id="sheet" role="dialog" aria-modal="true" aria-label="Choose what to work on">
  <div id="sheetIn">
    <button id="optFile" class="opt" type="button">OPEN A FILE</button>
    <button id="optCancel" class="optx" type="button">CANCEL</button>
  </div>
</div>

<div id="status"></div>

<input id="picker" type="file" accept="audio/*,video/*,image/*,.wav,.mp3,.m4a,.aac,.ogg,.oga,.opus,.flac,.aiff,.aif,.mp4,.m4v,.mov,.webm,.mkv,.jpg,.jpeg,.png,.gif,.webp,.avif,.bmp,.heic">
<audio id="audio" preload="auto" playsinline></audio>

<script>
"use strict";
/* ============================================================
   CORE — pure maths. No DOM. Deterministic.
   ============================================================ */
/*<CORE>*/
var Core = (function () {

  /* ---------- deterministic hashing ----------
     Same inputs always give the same output. No stored geometry. */
  function h32(a, b, c) {
    var h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1103515245);
    h ^= h >>> 13;
    h = Math.imul(h, 1274126177);
    h ^= h >>> 16;
    h = Math.imul(h, 2654435761);
    return (h ^ (h >>> 15)) >>> 0;

  function rnd(a, b, c) { return h32(a, b, c) / 4294967296; }

  /* value noise in 2 dimensions */

  function vnoise(x, y, seed) {
    var xi = Math.floor(x), yi = Math.floor(y);

    var u = smooth(xf), v = smooth(yf);
    var a = rnd(xi, yi, seed);
    var b = rnd(xi + 1, yi, seed);
    var c = rnd(xi, yi + 1, seed);
    var d = rnd(xi + 1, yi + 1, seed);

  }

  function fbm(x, y, seed, oct) {
    var s = 0, amp = 0.5, f = 1, norm = 0;
    for (var i = 0; i < oct; i++) {
      s += amp * vnoise(x * f, y * f, seed + i * 7919);
      norm += amp;
      amp *= 0.5; f *= 2.03;
    }

  /* ---------- small helpers ---------- */
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function smoothstep(e0, e1, x) {

  }

  /* percentile of a Float32Array, from a subsample for speed */
  function percentile(arr, p, maxSamples) {
    var n = arr.length;
    if (n === 0) return 0;
    var stride = Math.max(1, Math.floor(n / (maxSamples || 8192)));

    for (var i = 0; i < n; i += stride) tmp.push(arr[i]);
    tmp.sort(function (a, b) { return a - b; });

  }

  /* circular moving average. Two passes give a soft, rounded result.
     The wrap keeps the loop point seamless. */
  function smoothArray(arr, radius, passes) {
    var n = arr.length;
    if (n < 3 || radius < 1) return arr;
    var src = arr, dst = new Float32Array(n), i, j, k;
    var w = radius * 2 + 1;
    for (var pass = 0; pass < (passes || 2); pass++) {
      var acc = 0;
      for (j = -radius; j <= radius; j++) { k = j % n; if (k < 0) k += n; acc += src[k]; }
      for (i = 0; i < n; i++) {
        dst[i] = acc / w;
        var outI = (i - radius) % n; if (outI < 0) outI += n;
        var inI = (i + radius + 1) % n;

  /* ---------- radix 2 FFT, magnitudes only ---------- */
  function FFT(n) {
    this.n = n;
    this.levels = Math.round(Math.log(n) / Math.LN2);
    if (1 << this.levels !== n) throw new Error("FFT size must be a power of two");
    this.cos = new Float32Array(n / 2);
    this.sin = new Float32Array(n / 2);
    for (var i = 0; i < n / 2; i++) {
      this.cos[i] = Math.cos(2 * Math.PI * i / n);
      this.sin[i] = Math.sin(2 * Math.PI * i / n);
    }
    this.rev = new Uint32Array(n);
    for (var j = 0; j < n; j++) {
      var x = j, r = 0;
      for (var b = 0; b < this.levels; b++) { r = (r << 1) | (x & 1); x >>>= 1; }
      this.rev[j] = r;
    }

    this.im = new Float32Array(n);
    this.win = new Float32Array(n);          /* Hann window */

  /* src: Float32Array, off: start index. Writes magnitudes into out (n/2). */
  FFT.prototype.mag = function (src, off, out) {
    var n = this.n, re = this.re, im = this.im, rev = this.rev, win = this.win;
    var i, k;
    for (i = 0; i < n; i++) {
      var s = (off + i < src.length) ? src[off + i] : 0;
      re[rev[i]] = s * win[i];
      im[i] = 0;
    }
    for (i = 0; i < n; i++) im[i] = 0;
    for (var size = 2; size <= n; size <<= 1) {
      var half = size >> 1, step = n / size;
      for (i = 0; i < n; i += size) {

          var tre = re[l] * this.cos[t] + im[l] * this.sin[t];
          var tim = -re[l] * this.sin[t] + im[l] * this.cos[t];

          re[j] += tre; im[j] += tim;

  /* ---------- analyser ----------

     One row for each hop. About 86 rows for each second at 44100 Hz. */
  var FFT_SIZE = 1024, HOP = 512;

     The analyser already runs a whole FFT for every row and then
     threw all but three sums of it away. Keeping a log spaced set

     about 2.5 MB on a five minute track. Everything that wants a

  var NBANDS = 24;
  var BAND_LO = 30, BAND_HI = 12000;

    this.prev = new Float32Array(FFT_SIZE / 2);
    this.rows = Math.max(1, Math.floor((mono.length - FFT_SIZE) / HOP) + 1);
    this.i = 0;
    this.level = new Float32Array(this.rows);
    this.bass = new Float32Array(this.rows);
    this.mid = new Float32Array(this.rows);
    this.high = new Float32Array(this.rows);
    this.flux = new Float32Array(this.rows);
    this.beat = new Float32Array(this.rows);

    this.b0 = Math.max(1, Math.floor(20 / hz));
    this.b1 = Math.floor(200 / hz);
    this.m1 = Math.floor(2000 / hz);
    this.h1 = Math.min(FFT_SIZE / 2 - 1, Math.floor(9000 / hz));

    var top = FFT_SIZE / 2 - 1;
    this.edge = new Int32Array(NBANDS + 1);
    for (var e = 0; e <= NBANDS; e++) {
      var f = BAND_LO * Math.pow(BAND_HI / BAND_LO, e / NBANDS);
      this.edge[e] = Math.max(1, Math.min(top, Math.round(f / hz)));
    }
    for (e = 1; e <= NBANDS; e++) {
      if (this.edge[e] <= this.edge[e - 1]) this.edge[e] = this.edge[e - 1] + 1;

    var end = Math.min(this.rows, this.i + count);
    var spec = this.spec, prev = this.prev, mono = this.mono;
    for (; this.i < end; this.i++) {

      for (k = this.b0; k <= this.b1; k++) bs += spec[k];
      for (k = this.b1 + 1; k <= this.m1; k++) md += spec[k];
      for (k = this.m1 + 1; k <= this.h1; k++) hi += spec[k];
      for (k = 1; k < spec.length; k++) {
        sum += spec[k];
        var d = spec[k] - prev[k];
        if (d > 0) fx += d;
        prev[k] = spec[k];

      this.bass[this.i] = bs / (this.b1 - this.b0 + 1);
      this.mid[this.i] = md / (this.m1 - this.b1 + 1);
      this.high[this.i] = hi / (this.h1 - this.m1 + 1);
      this.flux[this.i] = fx;

      for (k = 0; k < NBANDS; k++) {

      var acc = 0, n2 = Math.min(FFT_SIZE, mono.length - off);
      for (k = 0; k < n2; k++) { var s = mono[off + k]; acc += s * s; }

  };

  /* normalise, then find the beats */
  Analyzer.prototype.finish = function () {
    var f = ["level", "bass", "mid", "high", "flux"], i, j;
    for (i = 0; i < f.length; i++) {
      var a = this[f[i]];

      var scale = p > 1e-7 ? 1 / p : 0;
      for (j = 0; j < a.length; j++) a[j] = clamp(a[j] * scale, 0, 1.6);
    }
    /* Roll the terrain bands. Raw bins change every 12 ms, which builds
       a wall of needles instead of hills. */
    smoothArray(this.bass, Math.max(3, Math.round(0.200 * this.sr / HOP)), 2);
    smoothArray(this.mid, Math.max(2, Math.round(0.095 * this.sr / HOP)), 2);
    smoothArray(this.high, Math.max(1, Math.round(0.055 * this.sr / HOP)), 2);

    /* Each band is levelled against itself. A shared scale would
       leave the top octaves black, because there is far less energy
       up there in almost every piece of music. */
    var bw = Math.max(1, Math.round(0.070 * this.sr / HOP));
    for (i = 0; i < NBANDS; i++) {
      var ba = this.band[i];
      var bp = percentile(ba, 0.96);
      var bsc = bp > 1e-9 ? 1 / bp : 0;
      for (j = 0; j < ba.length; j++) ba[j] = clamp(ba[j] * bsc, 0, 1.4);
      smoothArray(ba, bw, 1);
    }
    var mx = 0;
    for (i = 0; i < this.rows; i++) { if (this.bass[i] > mx) mx = this.bass[i]; }

    /* adaptive threshold peak picking on the flux */
    var rows = this.rows, flux = this.flux, beat = this.beat;
    var win = Math.max(4, Math.round(0.35 * this.sr / HOP));
    var minGap = Math.max(2, Math.round(0.11 * this.sr / HOP));
    var last = -1e9;
    for (i = 0; i < rows; i++) {
      var lo = Math.max(0, i - win), hi2 = Math.min(rows - 1, i + win), s = 0;

        flux[i] >= flux[Math.min(rows - 1, i + 1)] &&

  };

  Analyzer.prototype.table = function () {
    return {
      rows: this.rows,
      hop: HOP,
      sampleRate: this.sr,
      rowsPerSec: this.sr / HOP,
      duration: this.mono.length / this.sr,
      level: this.level, bass: this.bass, mid: this.mid,

  function seedFromTable(t) {

    for (var i = 0; i < n; i += stride) {

  function at(arr, row, rows) {
    var r = row % rows;
    if (r < 0) r += rows;

  function atf(arr, rowF, rows) {

  /* ---------- camera and projection ----------
     Forward projection. sx = ex * focal / ez + cx.  */
  function Camera() {
    this.x = 0; this.y = 2; this.z = 0;
    this.yaw = 0; this.pitch = 0; this.roll = 0;
    this.fov = 1.15;
    this.w = 1; this.h = 1; this.cx = 0.5; this.cy = 0.5; this.focal = 1;
    this._cy = 1; this._sy = 0; this._cp = 1; this._sp = 0; this._cr = 1; this._sr = 0;
  }
  /* The focal length comes from the SHORT side of the frame.
     Basing it on the height alone, as v1.8 did, left a phone held
     upright with a horizontal view of about 34 degrees: the

     the short side keeps the wide screen behaviour exactly as it
     was and opens the view up on a tall screen instead. */
  Camera.prototype.setViewport = function (w, h) {
    this.w = w; this.h = h;

  };
  Camera.prototype.update = function () {
    this._cy = Math.cos(this.yaw); this._sy = Math.sin(this.yaw);
    this._cp = Math.cos(this.pitch); this._sp = Math.sin(this.pitch);
    this._cr = Math.cos(this.roll); this._sr = Math.sin(this.roll);
  };
  /* writes [sx, sy, depth] into out. Returns false when the point is behind. */
  Camera.prototype.project = function (x, y, z, out) {
    var dx = x - this.x, dy = y - this.y, dz = z - this.z;
    var ex = dx * this._cy - dz * this._sy;
    var ez = dx * this._sy + dz * this._cy;
    var ey = dy * this._cp - ez * this._sp;
    var ez2 = dy * this._sp + ez * this._cp;
    if (ez2 < 0.08) return false;
    var rx = ex * this._cr - ey * this._sr;
    var ry = ex * this._sr + ey * this._cr;
    var inv = this.focal / ez2;

    out[1] = this.cy - ry * inv;
    out[2] = ez2;
    out[3] = inv;
    return true;
  };

  /* ---------- the beat pulse ----------
     v1.8 smoothed the pulse across frames with a rate that used the
     time between frames. A preview that drops frames and an export
     that does not then gave different values, so the export did not
     agree with the preview.

     This version is a closed form: it runs the same one pole filter
     across a fixed number of ANALYSIS ROWS that end at the given
     time. The row step never changes, so the result depends on the
     time only. The window is long enough that its start adds less
     than 0.02 percent, which is below one step of a byte. */
  var PULSE_ATT = 0.10, PULSE_REL = 0.26, PULSE_WIN = 2.4;

  function pulseTarget(T, rowF) {
    return clamp(0.55 * atf(T.beatEnv, rowF, T.rows) +
      0.45 * atf(T.bass, rowF, T.rows), 0, 1);
  }

  function pulseAt(T, tSec) {
    var rps = T.rowsPerSec;
    var rowF = tSec * rps;
    var i1 = Math.floor(rowF), frac = rowF - i1;
    var back = Math.max(8, Math.round(rps * PULSE_WIN));
    var dt = 1 / rps;
    var kAtt = 1 - Math.exp(-dt / PULSE_ATT);
    var kRel = 1 - Math.exp(-dt / PULSE_REL);
    var e = 0, i, tgt;
    for (i = i1 - back; i <= i1; i++) {
      tgt = pulseTarget(T, i);
      e += (tgt - e) * (tgt > e ? kAtt : kRel);
    }
    if (frac > 1e-6) {                       /* the part step to now */
      tgt = pulseTarget(T, rowF);
      var kf = 1 - Math.exp(-(dt * frac) / (tgt > e ? PULSE_ATT : PULSE_REL));
      e += (tgt - e) * kf;
    }

  /* ---------- loop locked phase ----------
     A style that wants an angle of w radians for each second cannot
     use w * t: the track loops, so the angle would jump back at the
     seam. This rounds w to the nearest rate that makes a whole
     number of turns in one loop. The motion looks the same and the
     seam stays smooth. */
  function phaseOf(w, tSec, duration) {
    if (!(duration > 0.001)) return w * tSec;
    /* A rate too slow to finish half a turn in one loop rounds to
       none. Rounding it up instead would speed the motion up by
       more than the motion is worth. */
    var cyc = Math.round(w * duration / (Math.PI * 2));
    if (cyc === 0) return 0;
    return (Math.PI * 2) * cyc * (tSec / duration);
  }

  /* Only what something outside this module actually reaches. The
     rest stays private: an export nobody calls is a promise nobody
     asked for, and it has to be kept working all the same. */
  return {
    rnd: rnd, fbm: fbm,
    clamp: clamp, smoothstep: smoothstep, percentile: percentile,
    Analyzer: Analyzer, seedFromTable: seedFromTable,
    atf: atf, Camera: Camera, pulseAt: pulseAt, phaseOf: phaseOf,
    HOP: HOP, NBANDS: NBANDS
  };
})();

/*<TABLES>*/
/* ============================================================

/*<GRID>*/
/* ============================================================
   GRID — the character grid that every style draws on.
   ------------------------------------------------------------
   The grid is measured in COLUMNS, never in pixels. Cell size
   follows from the render width, so a 1080p export lands on the
   same cells as the preview. This is the one change that makes
   the export agree with what you saw.

   The module touches no canvas and no DOM. That is on purpose:
   a frame of the grid can then be built in Node and compared
   with the same frame in the browser, which is the proof the
   whole export promise rests on.

   A style calls:
     Grid.begin(cols, aspect, W, H, camera, useDepth)
     Grid.splat(x, y, z, v)        for each point in the world
     ... or Grid.cell(cx, cy, v)   for a point already in cells
   App then hands the grid to Compose.
   ============================================================ */
var Grid = (function () {

  var g = {
    cols: 0, rows: 0, cw: 0, ch: 0, w: 0, h: 0,
    lum: null, depth: null, rgb: null, hasRGB: false
  };
  var out = [0, 0, 0, 0];
  var cam = null;
  var depthOn = false;
  /* the cell the last splat landed in, or -1. A style that carries
     colour writes the value first and the colour after, rather than
     working the cell out twice. */
  var hit = -1;

  /* Rows come from the frame shape and the cell shape. aspect is
     cell height divided by cell width. */
  function shapeOf(cols, aspect, W, H) {
    cols = Math.max(4, Math.round(cols));
    var cw = W / cols;
    var ch = cw * aspect;
    var rows = Math.max(2, Math.round(H / ch));
    return { cols: cols, rows: rows, cw: cw, ch: ch };
  }

  function begin(cols, aspect, W, H, camera, useDepth) {
    var s = shapeOf(cols, aspect, W, H);
    var n = s.cols * s.rows;
    if (g.lum === null || g.lum.length !== n) {
      g.lum = new Float32Array(n);
      g.depth = new Float32Array(n);
      g.rgb = new Uint8ClampedArray(n * 4);
    }
    g.cols = s.cols; g.rows = s.rows; g.cw = s.cw; g.ch = s.ch;
    g.w = W; g.h = H;
    g.lum.fill(0);
    g.depth.fill(1e30);
    g.hasRGB = false;
    depthOn = !!useDepth;
    cam = camera || null;
    return g;
  }

  /* a point already in screen pixels */
  function splatScreen(sx, sy, v) {
    var cx = (sx / g.cw) | 0, cy = (sy / g.ch) | 0;
    hit = -1;
    if (cx < 0 || cy < 0 || cx >= g.cols || cy >= g.rows) return;
    var i = cy * g.cols + cx;
    if (v > g.lum[i]) { g.lum[i] = v; hit = i; }
  }

  /* colour the cell the last write landed in */
  function tint(r, gg, b) {
    if (hit < 0) return;
    var o = hit * 4;
    g.rgb[o] = r; g.rgb[o + 1] = gg; g.rgb[o + 2] = b; g.rgb[o + 3] = 255;
    g.hasRGB = true;
  }

  /* A point in world space. Returns false only when the point is
     behind the camera, so a caller that walks upward can stop. */
  function splat(x, y, z, v) {
    hit = -1;
    if (!cam.project(x, y, z, out)) return false;
    var cx = (out[0] / g.cw) | 0, cy = (out[1] / g.ch) | 0;
    if (cx < 0 || cy < 0 || cx >= g.cols || cy >= g.rows) return true;
    var i = cy * g.cols + cx, d = out[2], had = g.depth[i];
    if (!depthOn) {
      /* depth is still kept, because the colour spread reads it,
         but the brighter value still wins */
      if (v > g.lum[i]) { g.lum[i] = v; g.depth[i] = d; hit = i; }
      return true;
    }
    if (d < had - 0.3) { g.depth[i] = d; g.lum[i] = v; hit = i; }  /* nearer wins */
    else if (d < had + 0.3 && v > g.lum[i]) { g.lum[i] = v; hit = i; }  /* one surface */
    return true;
  }

  /* ============================================================
     WARP — fold and bend the finished grid.
     ------------------------------------------------------------
     This runs after a style has filled the grid and before the
     levels are worked out, so it applies to EVERY style at once,
     the video ones included. It costs one pass over the cells,
     which is nothing next to filling them.

     Sampling is nearest neighbour on purpose. Softening a grid of
     characters only turns two crisp glyphs into one wrong one.
     ============================================================ */
  var wLum = null, wDep = null, wRgb = null;

  function warp(p) {
    var sym = p.sym, polar = p.polar, twist = p.twist;
    var kal = p.kal, keep = Math.round(p.kalKeep) | 0;
    var doSym = sym && sym !== "off";
    var doKal = kal && kal !== "off";
    var doPol = polar && polar !== "off";
    if (!doSym && !doKal && !doPol) return;
    var cols = g.cols, rows = g.rows, n = cols * rows;
    if (!wLum || wLum.length !== n) {
      wLum = new Float32Array(n);
      wDep = new Float32Array(n);
      wRgb = new Uint8ClampedArray(n * 4);
    }
    var TAU = Math.PI * 2;
    for (var y = 0, i = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++, i++) {
        var u = (x + 0.5) / cols, v = (y + 0.5) / rows;

        if (polar && polar !== "off") {
          /* The cell grid is not square, so the radius is measured
             in the shape the frame is really in. A circle worked
             out in cells comes back as an ellipse on screen. */
          var dx = (u - 0.5) * 2;
          var dy = (v - 0.5) * 2;
          var r = Math.sqrt(dx * dx + dy * dy) * 0.7071;
          var a = Math.atan2(dy, dx) / TAU + 0.5;
          if (twist) a += twist * r;
          u = a - Math.floor(a);
          if (polar === "tunnel") {
            var d = 0.22 / (r < 0.02 ? 0.02 : r);
            v = d - Math.floor(d);
          } else {
            v = r > 1 ? 1 : r;                  /* dome */
          }
        }

        /* SYMMETRY folds AND stretches: the half it keeps is opened
           out to the full width, so the whole picture is still in
           there, just doubled. */
        if (doSym) {
          u = (u < 0.5 ? u : 1 - u) * 2;
          if (sym === "quad") v = (v < 0.5 ? v : 1 - v) * 2;
        }

        /* KALEIDOSCOPE folds WITHOUT stretching: the half or quarter
           it keeps stays where it is at its own size, and is copied
           into the rest. The other half of the picture is thrown
           away, which is what a real kaleidoscope does and why it
           looks different from the fold above. KEEP says which part
           survives. */
        if (doKal) {
          if (kal === "quad") {
            u = ((keep === 1 || keep === 3) === (u > 0.5)) ? u : 1 - u;
            v = ((keep === 2 || keep === 3) === (v > 0.5)) ? v : 1 - v;
          } else if (keep === 2 || keep === 3) {
            v = ((keep === 3) === (v > 0.5)) ? v : 1 - v;   /* top or bottom */
          } else {
            u = ((keep === 1) === (u > 0.5)) ? u : 1 - u;   /* left or right */
          }
        }

        var sx = Math.floor(u * cols), sy = Math.floor(v * rows);
        if (sx < 0) sx = 0; else if (sx >= cols) sx = cols - 1;
        if (sy < 0) sy = 0; else if (sy >= rows) sy = rows - 1;
        var j = sy * cols + sx;
        wLum[i] = g.lum[j];
        wDep[i] = g.depth[j];
        if (g.hasRGB) {
          wRgb[i * 4] = g.rgb[j * 4];
          wRgb[i * 4 + 1] = g.rgb[j * 4 + 1];
          wRgb[i * 4 + 2] = g.rgb[j * 4 + 2];
          wRgb[i * 4 + 3] = g.rgb[j * 4 + 3];
        }
      }
    }
    g.lum.set(wLum);
    g.depth.set(wDep);
    if (g.hasRGB) g.rgb.set(wRgb);
  }

  return {
    begin: begin, splat: splat, cell: splatScreen, tint: tint, warp: warp,
    shapeOf: shapeOf,
    get: function () { return g; }
  };
})();
/*<INK>*/
/* ============================================================
   INK — one colour for each cell of the grid.
   ------------------------------------------------------------
   Every style shares this stage. It takes the grid and gives
   back a small RGBA map, one pixel for each cell. Compose then
   pours that map through the glyph mask.

   Working at cell size and not at pixel size is what keeps the
   cost flat: a 110 by 60 grid is 6600 pixels, whatever the
   render width is.

   Modes:
     mono      one ink
     grad      two inks along an axis
     spread    the ink hue opens out around the wheel
     palette   a palette. With a picture it snaps to the nearest
               entry. Without one it ramps by brightness, so the

     id       short name, also the key of the stored values
     name     the text on the display. A to Z, 0 to 9, space,
              dash, dot, slash and colon only
     media    "audio" or "video". A video file offers all four,
              an audio file offers the three audio styles
     depth    true to keep the nearest surface in each cell
     params   the style's own controls, shown on the WORLD tab
              for an audio style and on SOURCE for ASCIIFY
     camera   (s, p) sets s.cam for this frame. Audio only
     grid     (s, p) fills the cell grid. App has already called
              Grid.begin, and calls Compose after

   The state object s holds:
     s.T        the analysis table
     s.seed     the seed taken from the audio
     s.cam      the camera
     s.wrow     the world row at the playhead. Use it for cam.z
     s.wrows    world rows in one loop of the track
     s.t        the playhead, in seconds. THE ONLY CLOCK.
     s.ph(w)    an angle of about w radians for each second,
                rounded so it makes a whole number of turns in
                one loop. Use it for every free motion
     s.beatEnv  the beat envelope now, 0 to 1
     s.aspect   frame width divided by frame height
     s.cols     the width of the grid, in cells

   There is no wall clock and no frame counter. That is what
   lets a preview that drops frames and a full export agree.
   ============================================================ */
var Styles = (function () {
  var C = Core, W3 = World, G = Grid;

  /* VARIATION changes the seed only. The audio still decides the

  function vseed(s, p) {
    var v = Math.round(p.vary || 0);
    return v ? ((s.seed ^ Math.imul(v, 1640531527)) >>> 0) : s.seed;
  }

     moves. The step comes from the playhead, never from a frame
     count. Zero leaves the style exactly as it was. */
  function grainSeed(s, p) {

    return { key: key, label: label, min: min, max: max, step: step, def: def, fmt: fmt };
  }

  function num(v) { return String(Math.round(v)); }

  /* ---------------- 1. AUDIO LANDSCAPE ----------------
     Was ASCII WORLD in the parent. The camera flies down a lane
     through a landscape whose height is the spectrum of the
     track: bass in the middle, treble at the edges, time front
     to back. */
  var landscape = {
    id: "ascii",
    name: "AUDIO LANDSCAPE",
    media: "audio",
    depth: false,
    params: [
      P("dist", "DISTANCE", 50, 240, 5, 140, num),
      P("height", "HEIGHT", 0, 16, 0.5, 7.5, num),
      P("detail", "TERRAIN", 0, 2, 0.05, 0.65, pct),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 0.95, pct),
      P("trees", "TREES", 0, 1, 0.02, 0.30, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function (s, p) {
      var cam = s.cam, seed = vseed(s, p);
      cam.z = s.wrow;
      cam.x = W3.laneX(s.wrow, s.wrows, seed) + Math.sin(s.wrow * 0.017) * 4;
      cam.y = W3.clearance(cam.z, s.T, seed, p.height, p.detail,
        W3.altitude(cam.z, s.T, seed, p.height, p.detail) + 3.3, 1.4);
      cam.yaw = Math.sin(s.wrow * 0.017 + 1.57) * 0.07;
      /* Look further down as the frame gets taller. A phone held
         upright showed a thin band of terrain with a whole screen
         of empty sky above it, because the horizon always sat in
         the middle. A wide frame is not changed at all. */
      cam.pitch = -0.08 - 0.25 * C.clamp(1.35 - s.aspect, 0, 1);
      cam.roll = 0;
    },
    grid: function (s, p) {
      var cam = s.cam, T = s.T, seed = vseed(s, p);
      var dist = Math.round(p.dist);
      var treeProb = p.trees * 0.26;
      var nA = p.noise, gs = nA > 0 ? grainSeed(s, p) : 0;
      var splat = G.splat;

      /* Tile spacing follows the column count, so the world fills
         the grid whether you ask for 60 columns or 300. The parent
         used a fixed 26, which is what 110 columns gives here. */
      var density = Math.max(8, s.cols * 0.236);
      var wave = s.ph(3), swayT = s.ph(1.3);

      var riv = 0;
      W3.walk(cam, dist, density, s.aspect, function (x, wz, dz, lod, fade) {
        var g = W3.ground(x, wz, T, seed, p.height, p.detail);
        var wet = Math.abs(x - riv) < 5 ? 1 : 0;
        if (wet) g = -0.35 + Math.sin(wz * 0.5 + wave) * 0.16;

           to the darkest glyph, which filled the screen with one
           solid block. */

        splat(x, g, wz, v);

          var ob = W3.objectAt(x, wz, T, seed, treeProb, 2.6 + p.height * 0.22);
          if (ob > 0.3) {
            var steps = Math.min(11, Math.ceil(ob * 2.8));
            for (var i = 1; i <= steps; i++) {
              var sway = Math.sin(swayT + wz * 0.2) * 0.25 * (i / steps);

           A cell is nearly twice as tall as it is wide, so whole
           rows left the ground under the camera almost empty. It
           shows most on a tall frame. */

  function tubeTurn(sv, n, seed, bend) {
    return (W3.pnoise(0.5, sv, n, seed ^ 0x2c91, 1, 0.021, 1) - 0.5) * 2 * 0.012 * bend;
  }

    return (W3.pnoise(0.5, sv, n, seed ^ 0x71a3, 1, 0.017, 1) - 0.5) * 2 * 0.055 * bend;
  }

  var tube = {
    id: "tube",
    name: "AUDIO TUBE",
    media: "audio",
    depth: false,
    params: [
      P("dist", "DISTANCE", 40, 170, 5, 105, num),
      P("radius", "RADIUS", 3, 13, 0.5, 6.5, num),
      P("pulse", "PULSE", 0, 1, 0.02, 0.55, pct),
      P("twist", "TWIST", 0, 1, 0.02, 0.4, pct),
      P("arms", "ARMS", 0, 10, 1, 2, num),
      P("ribs", "RIBS", 0, 1, 0.02, 0.6, pct),
      P("bend", "BEND", 0, 1, 0.02, 0.55, pct),
      P("spectrum", "SPECTRUM", 0, 1.4, 0.02, 0.9, pct),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],

    camera: function (s, p) {
      var cam = s.cam, seed = vseed(s, p);

    grid: function (s, p) {

        return tubeTurn(sv, n, seed, p.bend);

      var y = 0;
      for (var f = 0; f < frames; f++) {

      var baseR = p.radius, floorR = baseR * 0.42;
      function radiusAt(sv) {

      var diagLim = Math.sqrt(gr.w * gr.w + gr.h * gr.h) * 0.58;
      /* Point spacing is measured in cells, not in pixels. A cell is
         the same share of the frame at any render size, so the ring
         gets the same number of points in a preview and an export. */

      var focal = cam.focal;
      var arms = Math.round(p.arms);
      var rot = s.ph(0.16 + 0.5 * p.twist);
      var twistK = p.twist * 0.28;
      var flow = s.ph(1.1 * p.twist);

      for (var dd = maxD; dd > 2;) {

        var Rr = radiusAt(sv);
        var i = Math.round(dd / RIB_STEP);

           loop stops. On a heavy beat the stop moved out past the

        var bM = W3.bandAt(T.mid, sv, T, head.mid);
        var bH = W3.bandAt(T.high, sv, T, head.high);
        var beatHere = W3.bandAt(T.beatEnv, sv, T, beat0);
        var fade = C.clamp(1.22 - (dd / maxD) * 1.22, 0, 1);
        fade = 0.12 + 0.88 * fade * fade * Math.sqrt(fade);
        var ribLift = p.ribs * 0.8 * Math.pow(beatHere, 1.4);

            var ca = Math.cos(thr), sa = Math.sin(thr);

            var helix = 0.5 + 0.5 * Math.sin(th * arms + sv * twistK + flow);
            var tone = 0.24 + spec * 0.46 + helix * 0.26 + ribLift;
            /* The grain is keyed to the ANGLE and the ARC POSITION,

               as a ring comes near, so a pattern keyed to j would
               crawl across the wall and read as a strobe. */

  };

  /* ---------------- 3. AUDIO TUNNEL ----------------
     An endless corridor. The camera stays at the origin and the
     hallway is built around it, so the route can turn without the
     camera ever moving in world space. Turns come from peaks in
     the bass, and a minimum gap keeps them from arriving too
     often to read.

     corner would show straight through the wall. */
  var brRib = new Path.Ribbon(600);
  var BR_STEP = 0.25;

  function brPlan(T, seed, n, p) {
    var arcLen = 60 - p.bend * 34;              /* higher CORNER, tighter corner */
    var key = seed + "|" + n + "|" + arcLen.toFixed(1) + "|" + p.turns.toFixed(2);
    if (brCache.key === key) return brCache.plan;
    brCache.plan = Path.plan(n, function (i) {
      return C.atf(T.bass, i * W3.TILE_ROWS, T.rows);
    }, {
      seed: seed, arcLen: arcLen, sensitivity: p.turns,
      minGap: Math.max(80, arcLen * 1.9)
    });
    brCache.key = key;
    return brCache.plan;
  }

  function fmod(a, b) { var r = a % b; return r < 0 ? r + b : r; }

  var tunnel = {
    id: "tunnel",
    name: "AUDIO TUNNEL",
    media: "audio",
    depth: true,
    params: [
      P("dist", "DISTANCE", 30, 130, 5, 70, num),
      P("width", "WIDTH", 3, 10, 0.5, 5.2, num),
      P("height", "CEILING", 2.4, 5, 0.1, 3.1, num),
      P("turns", "TURNS", 0, 1, 0.02, 0.5, pct),
      P("bend", "CORNER", 0, 1, 0.02, 0.45, pct),
      P("lights", "LIGHTS", 0, 1, 0.02, 0.8, pct),
      P("flicker", "FLICKER", 0, 1, 0.02, 0.35, pct),
      P("doors", "DOORS", 0, 1, 0.02, 0.45, pct),
      P("grime", "GRIME", 0, 1, 0.02, 0.5, pct),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),

    camera: function (s, p) {

      cam.yaw = 0; cam.pitch = 0;

    grid: function (s, p) {
      var cam = s.cam, T = s.T, seed = vseed(s, p);

      var splat = G.splat;

      var dip = Math.floor(s.tw * 1.2);

      /* A surface right beside the camera falls outside the frame.

         there, instead of sampling sections nobody can see. */

      var nearF = EYE * focal / (gr.h * 0.5);

        var i = Math.round(dd / BR_STEP);

        var bM = W3.bandAt(T.mid, sv, T, head.mid);

          var wob = 0.5 + 0.5 * Math.sin(s.ph(2.5 + ph * 4.2) + ph * 6.283);

          var fl = (1 - p.flicker * 0.35 * (1 - wob)) * (1 - p.flicker * 0.38 * (1 - dp));

        /* a doorway on one side, opening into nothing */

        for (j = 0; j <= nH; j++) {

          t = 0.52 + 0.12 * C.rnd(Math.round(side * 2.5), Math.round(sv * 2.5), seed);

          /* keyed to the position on the floor, never to j: nH grows

          if (nA > 0) t += jit(Math.round(side * 6), Math.round(sv * 6), gs, nA * 0.5);

          splat(q3[0], q3[1], q3[2], t * fade);

          t = 0.64;
          if (lit > 0 && Math.abs(side) < halfW * 0.42) t = 0.48 + lit * 0.8;

          if (nA > 0) t += jit(Math.round(side * 6) + 311, Math.round(sv * 6), gs, nA * 0.5);
          Path.offset(brRib, i, side, ceilY, q3);
          splat(q3[0], q3[1], q3[2], t * fade);

        /* the two walls */
        var y0 = floorY > -visV ? floorY : -visV;
        var y1 = ceilY < visV ? ceilY : visV;
        if (y1 > y0 && halfW <= visH + 0.5) {

/* ============================================================

   ------------------------------------------------------------

   the difference between knowing a track is loud and knowing
   what it is playing.

   into cells, which makes them the cheapest styles in the app
   and the ones that hold up best on a phone.

   Every one of them is a pure function of the time stamp. Where
   something has to fall, decay or trail, it is worked out by
   looking BACK along the table from the present moment, never

var Styles2 = (function () {
  var C = Core, W3 = World, G = Grid;
  var P = Styles.P, pct = Styles.pct, num = Styles.num;
  var TAU = Math.PI * 2;

  function nb(T) { return T.nBands || 24; }
  /* One scratch row of band levels, shared. Three styles were each
     making a new one for every frame; over a five minute export
     that is twenty seven thousand small arrays for the collector
     to sweep up, for no reason at all. */
  var LEV = new Float32Array(64), PEAK = new Float32Array(64);
  function bandAt(T, k, rowF) {
    if (!T.band || !T.band[k]) return 0;

  }
  /* the level, the beat and a band, all at a moment in the past */
  function lookBack(T, tSec, back) {
    var t = tSec - back;
    return t * T.rowsPerSec;
  }

  /* ---------------- 1. RINGS ----------------
     Seen from above, with the sound travelling outward. The
     brightness of a ring at radius r is simply what the track was
     doing r seconds ago, so a beat leaves a bright circle that
     grows and fades as it goes. There is nothing to simulate and
     nothing to remember: the history IS the picture. */
  var rings = {
    id: "rings",
    name: "RINGS",
    media: "audio",
    depth: false,
    params: [
      P("speed", "SPREAD", 0.5, 12, 0.1, 3.2, function (v) { return v.toFixed(1); }),
      P("beat", "BEAT", 0, 1.5, 0.02, 1.15, pct),
      P("body", "BODY", 0, 1.5, 0.02, 0.3, pct),
      P("bands", "COLOUR BY BAND", 0, 1, 0.02, 0.6, pct),
      P("fall", "FADE OUT", 0, 1.5, 0.02, 0.78, pct),
      P("squash", "SHAPE", 0.4, 2.2, 0.05, 1, function (v) { return v.toFixed(2); }),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function () { },
    grid: function (s, p) {
      var gr = G.get(), T = s.T;
      var cols = gr.cols, rows = gr.rows;
      var rps = T.rowsPerSec, NB = nb(T);
      var cx = (cols - 1) / 2, cy = (rows - 1) / 2;
      var rmax = Math.hypot(cx, cy / p.squash) || 1;
      var gs = p.noise > 0
        ? ((s.seed ^ Math.imul(Math.floor(s.t * 20) | 0, 2246822519)) >>> 0) : 0;

      for (var y = 0; y < rows; y++) {
        var dy = (y - cy) / p.squash;
        for (var x = 0; x < cols; x++) {
          var dx = x - cx;
          var r = Math.hypot(dx, dy) / rmax;
          var back = r * p.speed;
          var rowF = (s.tw - back) * rps;
          var v = p.beat * C.atf(T.beatEnv, rowF, T.rows) +
            p.body * C.atf(T.level, rowF, T.rows);
          if (p.bands > 0) {
            /* the angle picks the band, so a chord opens the ring
               into petals instead of a plain circle */
            var a = (Math.atan2(dy, dx) / TAU + 0.5);
            var k = Math.min(NB - 1, Math.floor(a * NB));
            v += p.bands * bandAt(T, k, rowF) * (0.35 + 0.65 * (1 - r));
          }
          v *= 1 - p.fall * r;
          if (gs) v += (C.rnd(x, y, gs) - 0.5) * p.noise * 0.4;
          gr.lum[y * cols + x] = v < 0 ? 0 : (v > 1 ? 1 : v);
          gr.depth[y * cols + x] = r;
        }
      }
    }
  };

  /* ---------------- 2. RAIN ----------------
     Columns of characters falling. There is a MATRIX RAIN look
     already, but that is scramble painted over a landscape. This
     is the real thing: each column has its own band, its own
     speed and its own head, and the head position is worked out
     from the clock rather than stepped along. */
  var rain = {
    id: "rain",
    name: "RAIN",
    media: "audio",
    depth: false,
    params: [
      P("speed", "FALL SPEED", 0.1, 6, 0.05, 1.5, function (v) { return v.toFixed(2); }),
      P("spread", "SPEED SPREAD", 0, 1, 0.02, 0.55, pct),
      P("tail", "TAIL", 0.02, 1, 0.01, 0.28, pct),
      P("density", "COLUMNS IN USE", 0.1, 1, 0.02, 0.8, pct),
      P("react", "REACT TO THE BAND", 0, 1.5, 0.02, 0.9, pct),
      P("head", "HEAD", 0, 1, 0.02, 0.7, pct),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function () { },
    grid: function (s, p) {
      var gr = G.get(), T = s.T;
      var cols = gr.cols, rows = gr.rows;
      var rps = T.rowsPerSec, NB = nb(T);
      var seed = Math.round(p.vary) ?
        ((s.seed ^ Math.imul(Math.round(p.vary), 1640531527)) >>> 0) : s.seed;
      var rowF = s.tw * rps;
      var tail = Math.max(1, p.tail * rows);
      var gs = p.noise > 0
        ? ((seed ^ Math.imul(Math.floor(s.t * 20) | 0, 2246822519)) >>> 0) : 0;

      for (var x = 0; x < cols; x++) {
        if (C.rnd(x, 3, seed) > p.density) continue;
        var k = Math.min(NB - 1, Math.floor(x / cols * NB));
        var e = bandAt(T, k, rowF);
        var sp = p.speed * (1 + p.spread * (C.rnd(x, 11, seed) - 0.5) * 2) *

        /* the head runs down the column and round again */
        var hy = ((s.tw * sp + phase) % 1) * (rows + tail) - tail * 0.5;
        for (var y = 0; y < rows; y++) {
          var dist = hy - y;
          if (dist < -0.5) continue;                 /* nothing below the head */
          var v = Math.exp(-dist / tail);
          if (dist < 1) v = 1;                       /* the bright head itself */

          v *= 0.25 + 0.75 * (0.4 + 0.6 * e);
          if (gs) v += (C.rnd(x, y, gs) - 0.5) * p.noise * 0.35;

          if (v > gr.lum[i]) { gr.lum[i] = v > 1 ? 1 : v; gr.depth[i] = 1 - v; }
        }
      }
    }
  };

  /* ---------------- 3. SPECTROGRAM ----------------
     Time across, pitch up, loudness as the glyph. The plainest
     reading of a piece of music there is, and the one that shows
     you most about what is actually in it. The present is at the
     right hand edge and the past scrolls away to the left. */
  var spectro = {
    id: "spectro",
    name: "SPECTROGRAM",
    media: "audio",
    depth: false,
    params: [
      P("span", "SECONDS ACROSS", 1, 30, 0.5, 8, function (v) { return v.toFixed(1) + " S"; }),
      P("tilt", "PITCH RANGE", 0.3, 1, 0.02, 1, pct),
      P("gain", "GAIN", 0.3, 3, 0.05, 1.15, function (v) { return v.toFixed(2); }),
      P("floorL", "FLOOR", 0, 0.5, 0.01, 0.02, pct),
      P("mirror", "MIRROR", 0, 1, 1, 0, function (v) { return Math.round(v) ? "ON" : "OFF"; }),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function () { },
    grid: function (s, p) {
      var gr = G.get(), T = s.T;
      var cols = gr.cols, rows = gr.rows;
      var rps = T.rowsPerSec, NB = nb(T);
      var mir = Math.round(p.mirror) === 1;
      var gs = p.noise > 0
        ? ((s.seed ^ Math.imul(Math.floor(s.t * 20) | 0, 2246822519)) >>> 0) : 0;

         worked out once and read down */
      for (var x = 0; x < cols; x++) {
        var back = (1 - x / Math.max(1, cols - 1)) * p.span;

          v = p.floorL + (1 - p.floorL) * v;
          if (gs) v += (C.rnd(x, y, gs) - 0.5) * p.noise * 0.3;
          var i = y * cols + x;
          gr.lum[i] = v < 0 ? 0 : (v > 1 ? 1 : v);
          gr.depth[i] = back / Math.max(0.01, p.span);
        }
      }
    }
  };

  /* ---------------- 4. BARS ----------------

     The cap over each bar is not carried forward from the last
     frame: it is the loudest that band has been over the last
     half second, read straight out of the table, which is what
     lets an export of it match the preview exactly. */
  var bars = {
    id: "bars",
    name: "BARS",
    media: "audio",
    depth: false,
    params: [
      P("gain", "GAIN", 0.3, 3, 0.05, 1.1, function (v) { return v.toFixed(2); }),
      P("gap", "GAP", 0, 0.6, 0.02, 0.15, pct),
      P("cap", "PEAK CAP", 0, 1, 0.02, 0.8, pct),
      P("hold", "CAP HOLD", 0.1, 3, 0.05, 0.7, function (v) { return v.toFixed(2) + " S"; }),
      P("floorL", "BASE GLOW", 0, 0.5, 0.02, 0.1, pct),
      P("mirror", "FROM THE MIDDLE", 0, 1, 1, 0, function (v) { return Math.round(v) ? "ON" : "OFF"; }),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function () { },
    grid: function (s, p) {
      var gr = G.get(), T = s.T;
      var cols = gr.cols, rows = gr.rows;
      var rps = T.rowsPerSec, NB = nb(T);
      var rowF = s.tw * rps;
      var mid = Math.round(p.mirror) === 1;
      var back = Math.max(2, Math.round(p.hold * rps));
      var gs = p.noise > 0
        ? ((s.seed ^ Math.imul(Math.floor(s.t * 20) | 0, 2246822519)) >>> 0) : 0;

      var lev = LEV, pk = PEAK;
      for (var k = 0; k < NB; k++) {
        lev[k] = C.clamp(bandAt(T, k, rowF) * p.gain, 0, 1);
        var m = 0;
        for (var q = 0; q <= back; q += 2) {
          var vq = bandAt(T, k, rowF - q);
          if (vq > m) m = vq;

        pk[k] = C.clamp(m * p.gain, 0, 1);
      }

      var half = p.gap * 0.5;
      for (var x = 0; x < cols; x++) {
        var fk = x / Math.max(1, cols) * NB;
        var kk = Math.min(NB - 1, Math.floor(fk));
        var within = fk - kk;
        if (within < half || within > 1 - half) continue;   /* the gap between */
        var h = lev[kk], c = pk[kk];
        for (var y = 0; y < rows; y++) {
          var up = 1 - (y + 0.5) / rows;
          var reach = mid ? Math.abs(up * 2 - 1) : up;

          if (reach <= h) v = p.floorL + (1 - p.floorL) * (1 - reach / Math.max(0.02, h)) * 0.55 + 0.45;
          if (p.cap > 0 && Math.abs(reach - c) < 0.9 / rows) v = Math.max(v, p.cap);

          if (gs) v += (C.rnd(x, y, gs) - 0.5) * p.noise * 0.3;
          var i = y * cols + x;

          gr.depth[i] = reach;

    }
  };

  /* ---------------- 5. ORBIT ----------------
     A wireframe ball of characters, turning, with the spectrum
     pushed out through its surface. The band a point reads comes
     from how far up the ball it sits, so the bass swells the
     poles and the treble ruffles the middle, or the other way
     round if you turn it over. */
  var orbit = {
    id: "orbit",
    name: "ORBIT",
    media: "audio",
    depth: true,
    params: [
      P("radius", "SIZE", 2, 22, 0.5, 8, num),
      P("dist", "DISTANCE", 8, 90, 1, 24, num),
      P("rings", "RINGS", 6, 60, 1, 18, num),
      P("push", "SPECTRUM", 0, 2, 0.02, 0.8, pct),
      P("spin", "SPIN", -2, 2, 0.05, 0.5, function (v) { return v.toFixed(2); }),
      P("tumble", "TUMBLE", 0, 1, 0.02, 0.25, pct),
      P("torus", "HOLE", 0, 1, 0.02, 0, pct),
      P("beat", "BEAT", 0, 1, 0.02, 0.45, pct),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function (s, p) {
      var cam = s.cam;
      cam.x = 0; cam.y = 0; cam.z = 0;
      cam.yaw = 0; cam.pitch = 0;
      cam.roll = Math.sin(s.ph(0.21)) * 0.12 * p.tumble;
    },
    grid: function (s, p) {
      var T = s.T, NB = nb(T);
      var rowF = s.tw * T.rowsPerSec;
      var head = W3.headOf(T);
      var beat = T.silent ? 0 : C.atf(T.beatEnv, rowF, T.rows);
      var R = p.radius * (1 + p.beat * 0.35 * beat);
      var Z = p.dist;
      var nR = Math.round(p.rings);
      var spin = s.ph(p.spin * 1.0);
      var tilt = Math.sin(s.ph(0.17)) * 0.6 * p.tumble;
      var gr = G.get();
      var splat = G.splat;
      var gs = p.noise > 0
        ? ((s.seed ^ Math.imul(Math.floor(s.t * 20) | 0, 2246822519)) >>> 0) : 0;

      /* the level of each band, once for the frame */
      var lev = LEV;
      for (var k = 0; k < NB; k++) lev[k] = bandAt(T, k, rowF);

      var ct = Math.cos(tilt), st = Math.sin(tilt);
      var targetPx = gr.cw * 0.8;
      var focal = s.cam.focal;

      for (var i = 0; i <= nR; i++) {
        var phi = (i / nR) * Math.PI;                 /* pole to pole */
        var sinPhi = Math.sin(phi), cosPhi = Math.cos(phi);
        /* how far up the ball decides which band this ring reads */
        var kk = Math.min(NB - 1, Math.floor((i / nR) * (NB - 1) + 0.5));
        var e = lev[kk];
        var rr = R * (1 + p.push * 0.5 * (e - 0.35));
        var ringR = rr * sinPhi + p.torus * R * 0.75;
        var yy = rr * cosPhi * (1 - p.torus * 0.55);

        /* How many points a ring needs is worked out from the size
           the ball would be with no music in it. Using the pushed
           out size instead made the count double on a loud beat,
           and twice the points on the same ring is twice the ink:
           the whole picture flashed. */
        var baseR = R * sinPhi + p.torus * R * 0.75;
        var screenR = Math.abs(baseR) * focal / Math.max(1, Z);
        var want = TAU * screenR / Math.max(1, targetPx);
        var count = 6;
        while (count < want && count < 200) count <<= 1;

        var v0 = 0.24 + 0.76 * C.clamp(e * 1.2, 0, 1);
        for (var j = 0; j < count; j++) {
          /* th0 is the place on the BALL, th is where that place has
             turned to. The grain is keyed to th0 so it rides the
             surface; keyed to th it would have sat still on the
             screen while the ball spun under it, which reads as a
             sheet of static rather than as texture. */
          var th0 = (j / count) * TAU;
          var th = th0 + spin;
          var px = Math.cos(th) * ringR;
          var pz = Math.sin(th) * ringR;
          /* tilt about the x axis, then push it out in front */
          var y2 = yy * ct - pz * st;
          var z2 = yy * st + pz * ct + Z;
          var v = v0 * (0.45 + 0.55 * C.clamp(1.6 - z2 / Math.max(1, Z), 0, 1));
          if (gs) v += (C.rnd(Math.round(th0 * 30), i, gs) - 0.5) * p.noise * 0.5;
          if (v > 0.02) splat(px, y2, z2, v);

    }
  };

  /* ---------------- 6. SKYLINE ----------------
     A street between two rows of towers. Each tower is a band,
     and its height is what that band was doing at the moment the
     camera reaches it, so the city ahead of you is the music that
     has not played yet. Blocks, not terrain: flat roofs, hard
     corners and lit windows. */
  var skyline = {
    id: "skyline",
    name: "SKYLINE",
    media: "audio",
    depth: true,
    params: [
      P("dist", "DISTANCE", 30, 160, 5, 90, num),
      P("street", "STREET WIDTH", 3, 24, 0.5, 9, num),
      P("height", "HEIGHT", 2, 40, 0.5, 16, num),
      P("plot", "PLOT SIZE", 1, 12, 0.5, 4, num),
      P("windows", "WINDOWS", 0, 1, 0.02, 0.55, pct),
      P("lift", "EYE HEIGHT", 0.5, 18, 0.5, 2.2, num),
      P("beat", "BEAT", 0, 1, 0.02, 0.3, pct),
      P("contrast", "CONTRAST", 0.4, 2.5, 0.05, 1, pct),
      P("noise", "NOISE", 0, 1, 0.02, 0, pct),
      P("vary", "VARIATION", 0, 24, 1, 0, num)
    ],
    camera: function (s, p) {
      var cam = s.cam;
      cam.x = Math.sin(s.wrow * 0.011) * p.street * 0.15;
      cam.y = p.lift;
      cam.z = s.wrow;
      cam.yaw = Math.sin(s.wrow * 0.011 + 1.57) * 0.05;
      cam.pitch = 0.06 - 0.30 * C.clamp(1.35 - s.aspect, 0, 1);
      cam.roll = 0;
    },
    grid: function (s, p) {
      var cam = s.cam, T = s.T, NB = nb(T);
      var seed = Math.round(p.vary) ?
        ((s.seed ^ Math.imul(Math.round(p.vary), 1640531527)) >>> 0) : s.seed;
      var rps = T.rowsPerSec;
      var half = p.street * 0.5;
      var plot = p.plot;
      var maxD = Math.round(p.dist);
      var gr = G.get(), splat = G.splat;
      var focal = cam.focal;
      var targetPx = gr.cw * 0.85;
      var head = W3.headOf(T);
      var gs = p.noise > 0
        ? ((seed ^ Math.imul(Math.floor(s.t * 20) | 0, 2246822519)) >>> 0) : 0;

      var z0 = Math.floor(cam.z / plot) * plot;
      for (var d = maxD; d > plot * 0.5; d -= plot) {
        var bz = z0 + d;
        var bi = Math.round(bz / plot);
        for (var side = -1; side <= 1; side += 2) {
          /* which band this block stands for, and how deep it is set
             back from the kerb */
          var k = Math.abs(bi * 7 + (side > 0 ? 3 : 0)) % NB;
          var rowF = bz * W3.TILE_ROWS;
          var e = bandAt(T, k, rowF);
          var beat = T.silent ? 0 : C.atf(T.beatEnv, rowF, T.rows);
          var h = (0.15 + 0.85 * e) * p.height * (1 + p.beat * 0.4 * beat);
          if (h < 0.4) continue;
          var w = plot * (0.5 + 0.4 * C.rnd(bi, side > 0 ? 5 : 9, seed));
          var xIn = side * (half + C.rnd(bi, side > 0 ? 13 : 21, seed) * plot * 0.6);
          var xOut = xIn + side * w;

          var dz = bz - cam.z;
          if (dz < 0.5) continue;
          var fade = C.clamp(1 - dz / maxD, 0, 1);
          fade = 0.14 + 0.86 * Math.pow(fade, 0.55);

          /* how many points a face needs to look solid from here */
          var nV = Math.round(h * focal / dz / targetPx);
          if (nV < 2) nV = 2; else if (nV > 90) nV = 90;
          var nH = Math.round(Math.abs(w) * focal / dz / targetPx);
          if (nH < 2) nH = 2; else if (nH > 40) nH = 40;

          var yy, xx, v, jj, kk2;
          /* the face toward the street */
          for (jj = 0; jj <= nV; jj++) {
            yy = (h * jj) / nV;
            for (kk2 = 0; kk2 <= nH; kk2++) {
              xx = xIn + (xOut - xIn) * (kk2 / nH);
              v = 0.34 + 0.20 * C.rnd(bi, Math.round(yy * 2), seed);
              if (p.windows > 0) {
                var lit = C.rnd(Math.round(xx * 3), Math.round(yy * 2) + bi, seed);
                if (lit < p.windows * 0.34) v = 0.95;
              }
              if (gs) v += (C.rnd(Math.round(xx * 4), Math.round(yy * 4), gs) - 0.5) * p.noise * 0.5;

            }
          }
          /* the roof line, which is what makes it read as a block */
          for (kk2 = 0; kk2 <= nH; kk2++) {
            xx = xIn + (xOut - xIn) * (kk2 / nH);
            splat(xx, h, bz, 0.98 * fade);

          /* the near corner, so the depth reads */
          var nD = Math.max(2, Math.round(plot * focal / dz / targetPx));
          for (jj = 0; jj <= nD; jj++) {
            splat(xIn, h, bz - plot * (jj / nD) * 0.55, 0.82 * fade);

        }

    }
  };

  return { list: [rings, rain, spectro, bars, orbit, skyline] };
})();

   ------------------------------------------------------------

   grid. This one samples the video straight into the same grid,

   glyphs, the ink, the effects, the export — is shared with
   them and needs no special case.

   lookup table for brightness, contrast, gamma, invert and
   posterize, then a 3 by 3 matrix for hue and saturation.

  /* THE LAST FRAME THAT ACTUALLY HAD SOMETHING IN IT.
     A video element has no current frame for a moment at its loop
