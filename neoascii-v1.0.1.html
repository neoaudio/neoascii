    setLcd(st.name);
    buildTabs();
    merge();
    qLevel = 0; slowFor = 0;
    /* Playback is not touched. Choosing a style used to start the
       track, which meant you could not compare two styles on a
       paused frame. Paused stays paused, playing stays playing. */
  }

  /* ============================================================
     THE DRAWER — a tabbed panel on the same metal
     ============================================================ */
  var activeTab = "world";
  var built = [];                 /* {desc, row, valEl, input} */

  function elm(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function visibleTabs() {
    var st = curStyle();
    if (!st) return [];
    /* THE GRID COMES FIRST.
       COLUMNS changes the picture more than any other control in the
       app, and it was at the foot of the tab under a style's own
       sliders. The order now follows the pipeline: the shape of the
       grid, then what fills it, then what folds it. */
    var own = {
      id: "world",
      name: "GRID",
      items: Shared.GRID_ITEMS
        .concat([{ t: "sub", l: st.media === "video" ? "SOURCE" : "WORLD" }])
        .concat(st.params.map(function (p) {
          return {
            t: "range", k: p.key, l: p.label, min: p.min, max: p.max,
            step: p.step, f: p.fmt, own: true
          };
        }))
        .concat(Shared.WARP_ITEMS)
    };
    var out = [own];
    Shared.TABS.forEach(function (tb) {
      if (tb.need === "pic" && st.media !== "video") return;
      out.push(tb);
    });
    return out;
  }

  function store(desc) { return desc.own ? curValues() : V; }

  function makeCtl(d) {
    var box = store(d), row, val = null, input = null;

    if (d.t === "sub") { row = elm("div", "sub", d.l); }
    else if (d.t === "note") { row = elm("p", "note", d.l); }
    else if (d.t === "info") { row = elm("p", "note info"); row.id = "info_" + d.id; }
    else if (d.t === "stamp") {
      row = elm("p", "stamp", APP_NAME + " v" + APP_VER);
    }
    else if (d.t === "presets") {
      row = elm("div", "presets");
      Shared.LOOKS.forEach(function (lk) {
        var b = elm("button", "chip", lk[0]);
        b.type = "button";
        b.addEventListener("click", function () {
          Shared.applyLook(lk[1]);
          buildPanel();
          merge();
          say(lk[0]);
        });
        row.appendChild(b);
      });
    }
    else if (d.t === "btns") {
      row = elm("div", "presets");
      d.b.forEach(function (pair) {
        var b = elm("button", "chip", pair[0]);
        b.type = "button";
        b.addEventListener("click", function () {
          if (pair[1] === "random") Shared.randomise();
          if (pair[1] === "reset") Shared.reset();
          buildPanel(); merge();
        });
        row.appendChild(b);
      });
    }
    else if (d.t === "toggle") {
      row = elm("div", "knob sw");
      var sb = elm("button", "swbtn");
      sb.type = "button";
      var mark = elm("span", "box");
      var lab = elm("span", "swlab", d.l);
      sb.appendChild(mark); sb.appendChild(lab);
      function paint() {
        mark.textContent = box[d.k] ? "[X]" : "[ ]";
        sb.setAttribute("aria-pressed", box[d.k] ? "true" : "false");
      }
      paint();
      sb.addEventListener("click", function () {
        box[d.k] = !box[d.k];
        paint(); merge(); syncPanel();
      });
      row.appendChild(sb);
      input = { paint: paint };
    }
    else if (d.t === "seg") {
      row = elm("div", "knob");
      var lb = elm("label");
      lb.appendChild(elm("span", null, d.l));
      row.appendChild(lb);
      var seg = elm("div", "seg");
      var btns = [];
      d.o.forEach(function (pair) {
        var b = elm("button", "segb", pair[1]);
        b.type = "button";
        b.addEventListener("click", function () {
          box[d.k] = pair[0];
          btns.forEach(function (x) { x.b.classList.toggle("on", x.v === pair[0]); });
          merge(); syncPanel();
        });
        btns.push({ b: b, v: pair[0] });
        seg.appendChild(b);
      });
      btns.forEach(function (x) { x.b.classList.toggle("on", x.v === box[d.k]); });
      row.appendChild(seg);
      input = {
        paint: function () {
          btns.forEach(function (x) { x.b.classList.toggle("on", x.v === box[d.k]); });
        }
      };
    }
    else if (d.t === "select") {
      row = elm("div", "knob");
      var l2 = elm("label");
      l2.appendChild(elm("span", null, d.l));
      row.appendChild(l2);
      var sel = elm("select");
      sel.setAttribute("aria-label", d.l);
      var olist = (typeof d.o === "function") ? d.o() : d.o;
      olist.forEach(function (pair) {
        var op = elm("option", null, pair[1]);
        op.value = String(pair[0]);
        sel.appendChild(op);
      });
      sel.value = String(box[d.k]);
      sel.addEventListener("change", function () {
        box[d.k] = d.num ? parseFloat(sel.value) : sel.value;
        merge(); syncPanel();
      });
      row.appendChild(sel);
      input = {
        el: sel,
        paint: function () {
          /* A value that is no longer offered would leave the box
             blank, so it falls back to the first entry. */
          var want = String(box[d.k]);
          var has = false;
          for (var i = 0; i < sel.options.length; i++) if (sel.options[i].value === want) has = true;
          if (!has && sel.options.length) { box[d.k] = d.num ? parseFloat(sel.options[0].value) : sel.options[0].value; merge(); }
          sel.value = String(box[d.k]);
        }
      };
    }
    else if (d.t === "color") {
      row = elm("div", "knob");
      var l3 = elm("label");
      l3.appendChild(elm("span", null, d.l));
      row.appendChild(l3);
      var ci = elm("input");
      ci.type = "color";
      ci.value = box[d.k];
      ci.setAttribute("aria-label", d.l);
      ci.addEventListener("input", function () { box[d.k] = ci.value; merge(); });
      row.appendChild(ci);
      input = { el: ci, paint: function () { ci.value = box[d.k]; } };
    }
    else if (d.t === "text") {
      row = elm("div", "knob");
      var l4 = elm("label");
      l4.appendChild(elm("span", null, d.l));
      row.appendChild(l4);
      var ti = elm("input");
      ti.type = "text";
      ti.value = box[d.k];
      ti.setAttribute("aria-label", d.l);
      ti.addEventListener("input", function () {
        box[d.k] = ti.value;
        if (d.after) d.after();
        merge(); syncPanel();
      });
      row.appendChild(ti);
      input = { el: ti, paint: function () { if (document.activeElement !== ti) ti.value = box[d.k]; } };
    }
    else {                                          /* range */
      row = elm("div", "knob");
      var l5 = elm("label");
      var nm = elm("span", null, d.l);
      val = elm("b");
      val.textContent = d.f ? d.f(box[d.k]) : String(Math.round(box[d.k]));
      l5.appendChild(nm); l5.appendChild(val);
      row.appendChild(l5);
      var ri = elm("input");
      ri.type = "range";
      ri.min = d.min; ri.max = d.max; ri.step = d.step;
      ri.value = box[d.k];
      ri.setAttribute("aria-label", d.l);
      ri.addEventListener("input", function () {
        box[d.k] = parseFloat(ri.value);
        val.textContent = d.f ? d.f(box[d.k]) : String(Math.round(box[d.k]));
        merge();
      });
      ri.addEventListener("change", syncPanel);
      row.appendChild(ri);
      input = {
        el: ri,
        paint: function () {
          ri.value = box[d.k];
          val.textContent = d.f ? d.f(box[d.k]) : String(Math.round(box[d.k]));
        }
      };
    }
    return { desc: d, row: row, input: input };
  }

  function buildTabs() {
    tabsEl.innerHTML = "";
    var tabs = visibleTabs();
    if (!tabs.some(function (t) { return t.id === activeTab; })) activeTab = tabs[0].id;
    /* The stylesheet lays the tabs out from this count, so five and
       six each get a tidy pair of rows on a narrow screen. Nothing
       scrolls sideways. */
    tabsEl.className = "n" + tabs.length;
    tabsEl.style.setProperty("--n", tabs.length);
    tabs.forEach(function (tb) {
      var b = elm("button", "tab", tb.name);
      b.type = "button";
      b.classList.toggle("on", tb.id === activeTab);
      b.setAttribute("aria-selected", tb.id === activeTab ? "true" : "false");
      b.addEventListener("click", function () {
        activeTab = tb.id;
        buildTabs();
      });
      tabsEl.appendChild(b);
    });
    buildPanel();
  }

  function buildPanel() {
    panelEl.innerHTML = "";
    built = [];
    var tabs = visibleTabs();
    var tb = null;
    for (var i = 0; i < tabs.length; i++) if (tabs[i].id === activeTab) tb = tabs[i];
    if (!tb) return;
    tb.items.forEach(function (d) {
      var c = makeCtl(d);
      built.push(c);
      panelEl.appendChild(c.row);
    });
    syncPanel();
  }

  /* show() hides a control that cannot do anything yet, so the
     panel never offers a dead slider */
  function syncPanel() {
    for (var i = 0; i < built.length; i++) {
      var c = built[i];
      var vis = c.desc.show ? !!c.desc.show() : true;
      c.row.style.display = vis ? "" : "none";
      if (vis && c.input && c.input.paint) c.input.paint();
    }
    var info = document.getElementById("info_outInfo");
    if (info) info.textContent = outLine();
  }

  /* ---------- what the export will give you ---------- */
  /* The answer is worked out from the browser every time the line
     is drawn, never held in a sentence that goes stale the moment
     the sound switch moves. */
  var caps = null;
  function capLine() {
    if (kind === "image") return "THE BUTTON SAVES THIS FRAME AS A PNG.";
    if (!caps) return "CHECKING WHAT THIS BROWSER CAN DO.";
    var fmt = Exporter.chooseFormat(V.withSound);
    if (!fmt) return "THIS BROWSER CANNOT WRITE A VIDEO. EXPORT IS OFF.";
    var name = fmt === "mp4" ? "AN MP4 FILE" : "A WEBM FILE";
    if (!V.withSound) return "YOU WILL GET " + name + " WITHOUT SOUND.";
    if (fmt === "mp4" ? caps.aac : caps.opus) return "YOU WILL GET " + name + " WITH SOUND.";
    return "YOU WILL GET " + name + ". THIS BROWSER HAS NO SOUND ENCODER, SO IT WILL BE SILENT.";
  }
  function outLine() {
    if (!T) return capLine();
    if (kind === "image") {
      var ih = Math.round(V.outW * (stage.height / stage.width));
      return capLine() + "  \u00b7  " + V.outW + " by " + (ih - (ih & 1)) + ".";
    }
    var h = Math.round(V.outW * (stage.height / stage.width));
    return capLine() + "  \u00b7  " + V.outW + " by " + (h - (h & 1)) +
      ", " + V.fps + " frames each second, " +
      Math.round(T.duration * V.fps) + " frames.";
  }
  function refreshCaps() {
    Exporter.probe().then(function (c) {
      caps = c;
      actBtn.disabled = (kind !== "image" && !c.h264 && !c.vp);
      syncPanel();
    });
  }

  /* ============================================================
     FILE LOADING
     ============================================================ */
  function looksLikeVideo(f) {
    if (/^video\//i.test(f.type || "")) return true;
    return /\.(mp4|m4v|mov|webm|mkv|avi|ogv|3gp)$/i.test(f.name || "");
  }
  function looksLikeImage(f) {
    if (/^image\//i.test(f.type || "")) return true;
    return /\.(jpe?g|png|gif|webp|avif|bmp|heic|heif|tiff?)$/i.test(f.name || "");
  }

  /* ---------- choosing an input ---------- */
  function openSheet() {
    sheet.classList.add("on");
    setTimeout(function () { optFile.focus(); }, 30);
  }
  function closeSheet() {
    sheet.classList.remove("on");
  }

  /* Let go of whatever was open. Leaving the other element attached
     kept the old track playing under the new one, and held its blob
     open as well. */
  function stopSources() {
    try { audioEl.pause(); videoEl.pause(); } catch (e) { }
  }

  function beginLoad() {
    /* Read these BEFORE anything is stopped: pausing the old source
       to make room for the new one would otherwise look like you
       had paused it yourself. */
    var st = curStyle();
    keepStyle = st ? st.id : "";
    keepPlaying = firstLoad ? true : wantPlay;
    firstLoad = false;
    state = S.BUSY;
    actBtn.disabled = true;
    prevBtn.disabled = true; nextBtn.disabled = true;
    say("");
    openPanels();
    stopSources();
  }

  function loadFile(file) {
    if (!file) return;
    if (looksLikeImage(file)) { loadImage(file); return; }
    loadTrack(file);
  }

  /* ---------- a track, or a video ---------- */
  function loadTrack(file) {
    srcFile = file;
    kind = looksLikeVideo(file) ? "video" : "audio";
    beginLoad();
    setLcd("READING");

    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(file);
    media = kind === "video" ? videoEl : audioEl;
    var other = kind === "video" ? audioEl : videoEl;
    try { other.removeAttribute("src"); other.load(); } catch (e) { }
    media.src = objUrl;
    media.loop = true;
    /* iOS will not start a media element unless the first play()
       happens inside the gesture that chose the file. The decode is
       asynchronous, so play() is called here and the element is
       already unlocked when the world is ready. */
    try { var pr0 = media.play(); if (pr0 && pr0.catch) pr0.catch(function () { }); } catch (e) { }
    drawPlay();

    file.arrayBuffer().then(function (ab) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error("no audio support");
      var ac = new AC();
      return new Promise(function (res, rej) {
        var done = false;
        var ok = function (b) { if (!done) { done = true; res({ buf: b, ac: ac }); } };
        var bad = function (e) { if (!done) { done = true; rej(e || new Error("decode")); } };
        try {
          var p = ac.decodeAudioData(ab, ok, bad);
          if (p && p.then) p.then(ok, bad);
        } catch (e) { bad(e); }
      });
    }).then(function (r) {
      var buf = r.buf;
      if (buf.duration > 900) say("LONG FILE. THIS MAY TAKE A MOMENT.", true);
      var n = buf.length, ch = buf.numberOfChannels, c, i, mono;
      if (ch === 1) {
        /* one channel is already the mix, so take it as it is */
        mono = buf.getChannelData(0);
      } else if (ch === 2) {
        var L = buf.getChannelData(0), R = buf.getChannelData(1);
        mono = new Float32Array(n);
        for (i = 0; i < n; i++) mono[i] = (L[i] + R[i]) * 0.5;
      } else {
        mono = new Float32Array(n);
        var inv = 1 / ch;
        for (c = 0; c < ch; c++) {
          var d = buf.getChannelData(c);
          for (i = 0; i < n; i++) mono[i] += d[i] * inv;
        }
      }
      var sr = buf.sampleRate;
      try { r.ac.close(); } catch (e) { }
      buf = null; r.buf = null;
      peaks = buildPeaks(mono, 1400);
      runAnalysis(mono, sr);
    }).catch(function () {
      if (kind === "video") { silentVideo(); return; }
      state = S.EMPTY;
      closePanels();
      setLcd("NO FILE");
      say("THAT FILE WOULD NOT OPEN. TRY WAV, MP3, M4A OR MP4.", true);
    });
  }

  /* A video with no sound track. Only ASCIIFY can run: the other
     three make their world out of the audio, and there is none. */
  function silentVideo() {
    function go() {
      var dur = videoEl.duration;
      if (!(dur > 0.05)) { setTimeout(go, 120); return; }
      T = stubTable(dur);
      seed = 1;
      wrows = World.rowsOf(T);
      peaks = new Float32Array(1400);
      list = [Asciify.style];
      styleIdx = pickStyle("asciify");
      finishLoad();
    }
    go();
  }

  function runAnalysis(mono, sr) {
    setLcd("ANALYSING");
    var an = new Core.Analyzer(mono, sr);
    var shown = -1;
    function work() {
      var t0 = performance.now(), done = false;
      /* 32 ms of work between breaths, not 24. The screen still gets
         its turn, and a five minute track spends a third less of its
         life waiting to be let go of. */
      while (performance.now() - t0 < 32) {
        done = an.step(1200);
        if (done) break;
      }
      if (!done) {
        /* The display is redrawn only when the figure on it changes.
          It was being redrawn every breath to show the same number. */
        var pc = Math.round(an.i / an.rows * 100);
        if (pc !== shown) { shown = pc; setLcd("ANALYSING " + pc + "%"); }
        /* setTimeout is held to 4 ms once it nests, which over a long
           track is whole seconds of doing nothing at all. */
        Exporter.yieldNow().then(work);
        return;
      }
      T = an.finish();
      seed = Core.seedFromTable(T);
      T.seed = seed;
      wrows = World.rowsOf(T);
      mono = null;
      list = styleList();
      /* A track opens on the tube and a video with sound on ORBIT.
         Only the first time: after that whatever was on stays on,
         and this is only where it lands when it cannot. */
      styleIdx = pickStyle(kind === "video" ? "orbit" : "tube");
      finishLoad();
    }
    Exporter.yieldNow().then(work);
  }

  /* ---------- a picture ---------- */
  function loadImage(file) {
    srcFile = file;
    kind = "image";
    beginLoad();
    setLcd("READING");
    if (objUrl) URL.revokeObjectURL(objUrl);
    objUrl = URL.createObjectURL(file);
    if (!imgEl) imgEl = new Image();
    imgEl.onload = function () {
      Asciify.setSource(imgEl);
      T = stubTable(1);
      seed = 1;
      wrows = World.rowsOf(T);
      peaks = new Float32Array(1400);
      media = stillMedia;
      stillMedia.paused = false;
      list = [Asciify.style];
      styleIdx = pickStyle("asciify");
      finishLoad();
    };
    imgEl.onerror = function () {
      state = S.EMPTY;
      closePanels();
      setLcd("NO FILE");
      say("THAT PICTURE WOULD NOT OPEN.", true);
    };
    imgEl.src = objUrl;
  }

  /* Stay where you were if the new file can still run it. A track
     cannot run ASCIIFY and a picture cannot run the landscape, so
     those are the only times the choice moves, and then it moves to
     what the file opens on. */
  function pickStyle(fallbackId) {
    var i;
    for (i = 0; i < list.length; i++) if (list[i].id === keepStyle) return i;
    for (i = 0; i < list.length; i++) if (list[i].id === fallbackId) return i;
    return 0;
  }

  function finishLoad() {
    addBtn.setAttribute("aria-label", "Change what you are working on");
    prevBtn.disabled = list.length < 2;
    nextBtn.disabled = list.length < 2;
    clock = 0;
    state = S.LIVE;
    actBtn.textContent = kind === "image" ? "SAVE PICTURE" : "EXPORT";
    afterStyle();
    if (keepPlaying) play(); else halt();
    drawWave(); drawPlay();
    refreshCaps();
    requestWake();
  }

  /* ---------- the screen stays awake while it plays ---------- */
  function requestWake() {
    try {
      if (navigator.wakeLock && !wakeLock) {
        navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }, function () { });
      }
    } catch (e) { }
  }
  function releaseWake() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { }
  }

  /* ============================================================
     THE FRAME
     ============================================================ */
  function build(t, W, H) {
    var st = curStyle();
    if (!st || !T) return null;
    var p = pm;
    var row = t * T.rowsPerSec;
    var dur = Math.max(0.001, T.duration);
    var tw = t % dur; if (tw < 0) tw += dur;
    var s = {
      T: T, seed: seed, cam: cam,
      wrow: row / World.TILE_ROWS,
      wrows: wrows,
      t: t, tw: tw, dur: dur,
      beatEnv: T.silent ? 0 : Core.atf(T.beatEnv, row, T.rows),
      aspect: W / H,
      cols: Math.round(p.cols),
      ph: function (w) { return Core.phaseOf(w, tw, dur); }
    };
    Grid.begin(p.cols, p.aspect, W, H, cam, st.depth);
    st.camera(s, p);
    cam.update();
    st.grid(s, p);
    /* the warp folds and bends the finished grid, for every style */
    Grid.warp(p);
    var gamma = 1 / Math.max(0.2, p.contrast == null ? 1 : p.contrast);
    var lv = Compose.levels(Grid.get(), p, tw, seed, gamma);
    var pulse = (p.beat > 0 && !T.silent) ? Core.pulseAt(T, tw) : 0;
    return { lv: lv, pulse: pulse };
  }

  function paintTo(target, t, W, H) {
    var r = build(t, W, H);
    if (!r) return false;
    Compose.paint(target, Grid.get(), r.lv, pm, r.pulse, W / 1280);
    return true;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = lastFrame ? Math.min(0.25, (now - lastFrame) / 1000) : 0;
    lastFrame = now;
    if (state !== S.LIVE) return;

    /* A track and a video have a playhead. A picture has no time of
       its own, so the clock simply runs, which is what makes
       SCRAMBLE move. */
    if (kind === "image") {
      if (!media.paused) clock += dt;
    } else {
      /* The media element is the master clock, with a local
         smoother. The smoother only chooses WHICH second to draw.
         What that second looks like never depends on the frame
         before it. */
      if (!media.paused) clock += dt;
      var at = media.currentTime, drift = at - clock;
      if (drift < -0.35 || drift > 0.35) clock = at;
      else clock += drift * Math.min(1, dt * 3);
    }

    var t0 = performance.now();
    cam.setViewport(stage.width, stage.height);
    paintTo(stage, clock, stage.width, stage.height);

    /* If the device cannot keep up, drop the PIXEL size. The grid
       is measured in columns, so fewer pixels give a softer picture
       and never a different one. */
    var cost = performance.now() - t0;
    frameEMA = frameEMA * 0.9 + cost * 0.1;
    if (frameEMA > 26 && qLevel < QS.length - 1) {
      slowFor += dt;
      if (slowFor > 2) { qLevel++; slowFor = 0; frameEMA = 16; resize(); }
    } else if (frameEMA < 20) slowFor = 0;

    waveTimer += dt;
    if (waveTimer > 0.1) { waveTimer = 0; drawWave(); }
  }

  /* ============================================================
     THE EXPORT
     ============================================================ */
  function seekVideo(t) {
    return new Promise(function (res) {
      var done = false;
      var ok = function () {
        if (done) return;
        done = true;
        videoEl.removeEventListener("seeked", ok);
        clearTimeout(tm);
        res();
      };
      var tm = setTimeout(ok, 4000);
      videoEl.addEventListener("seeked", ok);
      try { videoEl.currentTime = t; } catch (e) { ok(); }
    });
  }

  function setBar(p, txt) {
    barFill.style.width = (Core.clamp(p, 0, 1) * 100).toFixed(1) + "%";
    barTxt.textContent = txt;
  }
  function showBar(on) {
    bar.classList.toggle("on", !!on);
    eyeBtn.classList.toggle("busy", !!on);
  }

  /* A picture has one frame, so the button saves that frame. */
  function exportStill() {
    var W = V.outW - (V.outW & 1);
    var H = Math.round(W * (stage.height / stage.width));
    H -= (H & 1);
    if (!expCv) expCv = document.createElement("canvas");
    expCv.width = W; expCv.height = H;
    cam.setViewport(W, H);
    paintTo(expCv, clock, W, H);
    cam.setViewport(stage.width, stage.height);
    expCv.toBlob(function (b) {
      if (b) { save(b, "png"); say("SAVED A PICTURE, " + W + " BY " + H + "."); }
      else say("THE PICTURE COULD NOT BE SAVED", true);
      if (hidForJob) { setHidden(false); hidForJob = false; }
    }, "image/png");
  }

  function startExport() {
    if (state !== S.LIVE || !T) return;
    /* THE CONTROLS GET OUT OF THE WAY.
       The export is drawn on the stage itself, frame by frame, so
       what you watch during a render IS the render. Controls over
       the top of it would only hide the thing you are waiting for.
       The eye stays where it is, so one tap brings the progress bar
       and the STOP button back. */
    if (!hidden) { setHidden(true); hidForJob = true; }
    if (kind === "image") { exportStill(); return; }
    var st = curStyle();
    state = S.EXPORT;
    cancelJob = false;
    media.pause();
    drawPlay();
    releaseWake();
    actWrap.classList.add("busy");
    showBar(true);
    setBar(0, "STARTING");

    /* The shape of the export comes from the stage BEFORE the stage
       is resized to it, or the second export of a session would
       take its aspect from the first. */
    var W = V.outW - (V.outW & 1);
    var H = Math.round(W * (stage.height / stage.width));
    H -= (H & 1);
    /* The stage IS the export canvas. One render each frame serves
       both the file and the screen, and the stylesheet stretches it
       back to the window, so the picture you watch is the picture
       being written. */
    stage.width = W; stage.height = H;

    /* where the playhead was, to be put back when the run ends */
    var wasAt = clock;
    var t0 = performance.now();
    var phase = "";
    /* A looping video wraps while it is being stepped, which would
       put the start of the clip at the end of the export. */
    var wasLoop = videoEl.loop;
    videoEl.loop = false;
    var ahead = null, aheadT = -1;

    Exporter.run({
      file: srcFile,
      duration: T.duration,
      fps: V.fps, width: W, height: H,
      quality: V.quality, withSound: V.withSound,
      cancelled: function () { return cancelJob; },
      onPhase: function (n) { phase = n; setBar(0, n); },
      onProgress: function (i, n) {
        if (!hidden) drawWave();
        var el = (performance.now() - t0) / 1000;
        var f = n ? i / n : 0;
        var left = f > 0.004 ? el / f - el : 0;
        setBar(f, phase === "WRITING THE SOUND"
          ? "SOUND " + Math.round(f * 100) + "%"
          : "FRAME " + i + " OF " + n + "  \u00b7  " +
          (left ? Math.ceil(left) + "S LEFT" : "\u2014"));
      },
      frameAt: function (i, t) {
        var isVid = st.media === "video";
        var go;
        if (!isVid) go = Promise.resolve();
        else if (aheadT === t && ahead) go = ahead;
        else go = seekVideo(t);
        ahead = null;
        return go.then(function () {
          cam.setViewport(W, H);
          paintTo(stage, t, W, H);
          clock = t;                    /* the waveform tracks it too */
          /* The pixels are already in the grid, so the video may
             move on now. Starting the next seek here puts its wait,
             which is 10 to 50 ms, underneath the encoding of this
             frame instead of in front of the next one. */
          if (isVid) {
            var nt = (i + 1) / V.fps;
            if (nt < T.duration) { aheadT = nt; ahead = seekVideo(nt); }
          }
          return stage;
        });
      }
    }).then(function (r) {
      if (r.blob && r.frames > 0) {
        save(r.blob, r.ext);
        say((cancelJob ? "STOPPED EARLY. SAVED " : "SAVED ") +
          r.frames + " FRAMES AT " + r.width + " BY " + r.height + ", " +
          r.ext.toUpperCase() + (r.sound ? ", WITH SOUND." : ", SILENT."));
      } else {
        say("EXPORT STOPPED", true);
      }
    }).catch(function (e) {
      say("EXPORT FAILED: " + ((e && e.message) ? String(e.message).toUpperCase() : "ENCODER ERROR"), true);
    }).then(function () {
      actWrap.classList.remove("busy");
      showBar(false);
      videoEl.loop = wasLoop;
      state = S.LIVE;                   /* so resize will act on it again */
      resize();                         /* the stage goes back to the window */
      if (hidForJob) { setHidden(false); hidForJob = false; }
      clock = wasAt;
      if (st.media === "video") seekVideo(clock);
      play();
      requestWake();
    });
  }

  function save(blob, ext) {
    var d = new Date();
    function p2(n) { return String(n).padStart(2, "0"); }
    var name = "neoascii_" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) +
      "_" + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds()) + "." + ext;
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 20000);
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  function setHidden(on) {
    hidden = on;
    ui.classList.toggle("gone", on);
    statusEl.classList.toggle("gone", on);
    eyeBtn.classList.toggle("shut", on);
    eyeBtn.setAttribute("aria-pressed", on ? "true" : "false");
    eyeBtn.setAttribute("aria-label", on ? "Show the controls" : "Hide the controls");
  }

  function wire() {
    /* THE SHEET IS THE OPENING SCREEN, NOT A TOLL GATE.
       On the bare screen the plus has to say what it is for, so it
       asks. Once something is loaded the answer is known, and a
       second tap saying the same thing is only in the way, so the
       plus becomes the file button itself. The picker is opened
       inside the press, which is the only place a browser honours
       it. */
    addBtn.addEventListener("click", function () {
      if (state === S.EMPTY) openSheet();
      else picker.click();
    });
    optCancel.addEventListener("click", closeSheet);
    sheet.addEventListener("click", function (e) {
      if (e.target === sheet) closeSheet();
    });
    optFile.addEventListener("click", function () { closeSheet(); picker.click(); });

    picker.addEventListener("change", function () {
      var f = picker.files && picker.files[0];
      picker.value = "";
      loadFile(f);
    });

    playBtn.addEventListener("click", toggle);

    waveWrap.addEventListener("pointerdown", function (e) {
      if (!T) return;
      e.preventDefault();
      scrubbing = true;
      try { waveWrap.setPointerCapture(e.pointerId); } catch (err) { }
      scrubToX(e.clientX);
    });
    waveWrap.addEventListener("pointermove", function (e) {
      if (scrubbing) scrubToX(e.clientX);
    });
    function endScrub(e) {
      if (!scrubbing) return;
      scrubbing = false;
      try { waveWrap.releasePointerCapture(e.pointerId); } catch (err) { }
    }
    waveWrap.addEventListener("pointerup", endScrub);
    waveWrap.addEventListener("pointercancel", endScrub);
    waveWrap.addEventListener("keydown", function (e) {
      if (!T) return;
      var step = 5 / T.duration;
      if (e.key === "ArrowLeft") { e.preventDefault(); seekFraction(clock / T.duration - step); }
      if (e.key === "ArrowRight") { e.preventDefault(); seekFraction(clock / T.duration + step); }
      if (e.key === "Home") { e.preventDefault(); seekFraction(0); }
    });

    prevBtn.addEventListener("click", function () { setStyle(-1); });
    nextBtn.addEventListener("click", function () { setStyle(1); });

    lcd.addEventListener("click", function () {
      if (!T) return;
      var open = drawer.classList.toggle("open");
      lcd.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) syncPanel();
    });
    lcd.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); lcd.click(); }
    });

    actBtn.addEventListener("click", startExport);
    bar.addEventListener("click", function () {
      cancelJob = true;
      barTxt.textContent = "STOPPING";
    });

    eyeBtn.addEventListener("click", function () { setHidden(!hidden); });

    document.addEventListener("keydown", function (e) {
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (e.key === "Escape") {
        e.preventDefault();
        if (sheet.classList.contains("on")) { closeSheet(); return; }
        setHidden(!hidden);
        return;
      }
      if (sheet.classList.contains("on")) return;
      if (state !== S.LIVE) return;
      if (document.activeElement === waveWrap) return;
      if (e.key === "ArrowLeft" && !prevBtn.disabled) { e.preventDefault(); setStyle(-1); }
      if (e.key === "ArrowRight" && !nextBtn.disabled) { e.preventDefault(); setStyle(1); }
      if (e.key === " " && document.activeElement === document.body) {
        e.preventDefault();
        toggle();
      }
    });

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", function () { setTimeout(resize, 220); });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        /* stop the sound, but do not call it a pause you made */
        try { media.pause(); } catch (e) { }
        drawPlay();
        releaseWake();
      } else if (state === S.LIVE) {
        if (wantPlay) { var pr = media.play(); if (pr && pr.catch) pr.catch(function () { }); }
        drawPlay();
        if (wantPlay) requestWake();
      }
    });
    media = audioEl;
    audioEl.addEventListener("play", function () { lastFrame = 0; drawPlay(); });
    audioEl.addEventListener("pause", drawPlay);
    videoEl.addEventListener("play", function () { lastFrame = 0; drawPlay(); });
    videoEl.addEventListener("pause", drawPlay);
    videoEl.addEventListener("loadedmetadata", function () { Asciify.setSource(videoEl); });
    window.addEventListener("beforeunload", function () {
      if (objUrl) URL.revokeObjectURL(objUrl);
    });
  }

  function init() {
    Shared.setStartWidth(window.innerWidth || 1024);
    Shared.setPicTest(function () {
      var st = curStyle();
      return !!st && st.media === "video";
    });
    Asciify.setSource(videoEl);
    wire();
    resize();
    drawPlay();
    setLcd("NO FILE");
    Exporter.probe().then(function (c) { caps = c; syncPanel(); });
    requestAnimationFrame(frame);
  }

  return { init: init };
})();

App.init();
</script>
</body>
</html>
